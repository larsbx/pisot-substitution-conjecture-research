note = "Lean proves P_C N_C = M P_C on the raw ordered states and, for balanced states, on normalised representatives with N_C = A + B; and, assuming chi_M irreducible and C nonempty (on representatives the nonempty top tracks follow from balance, Psc.SignedCocycle.Normalisation.top_ne_nil; the double cover assumes them): rank P_C = d, m >= d, chi_M | chi_{N_C} over Q and Z, and similarity to M when m = d. The double-cover m = d clause is vacuous under a normalisation (no_equiv_fin3). Also: chi_{N_C} = chi_M * chi_{N_C | ker P_C} with the factors coprime and beta a simple root of chi_{N_C} (given strong connectivity of N_C and l > 0), rho(N_C) = beta for a primitive substitution with balanced states, and Theorem A(iv) on representatives. Not formalized: that beta is the only eigenvalue of modulus beta; swap closure is a hypothesis here and is shown to be without loss of generality in Psc.Descendants; children_swap is derived for zero-return children (Psc.Reduction.redNormalisation). Psc.StrictSystem restates the cofactor and Theorem A(iv) in abstract form on a strict component over Fin 3 with every structural hypothesis discharged (StrictComponent.kernel_cofactor, given M primitive and chi_M irreducible), and |R| >= 3 for every normalisation of a strict system (StrictSystem.three_le_card_rep)."
