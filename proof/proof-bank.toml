note = "Lean proves Q_r S = Phi_r Q_r on normalised representatives for r = 2 (M (x) M on any finite alphabet; Lambda^2 M in wedge coordinates over Fin 3) and r = 3 (M^{(x)3}), assuming the lower defects vanish on every state, and that over Fin 3 the K_3 columns lie in Lie_3 (Ree at degree three on three letters, explicit Lyndon basis), which M^{(x)3} preserves. Also the weights of Phi_3 on Lie_3 for diagonalizable M (charpoly_phi3Lie), and (Psc.SectorBridge) the diagonalization of M from three distinct roots of chi_M (e.g. chi_M irreducible), Q_3 S = Phi_3 Q_3 into Lie_3, q_3 = chi(Phi_3 | im Q_3) dividing chi_S and chi(Phi_3), and every root of q_3 a root of chi_S and a weight of shape (2,1,0) or (1,1,1). Not formalized: the first-defect selection and thm:deg23 (iii) itself (it also needs rho(S) <= beta as a bound on the roots of chi_S and semisimplicity of Phi_3 on im Q_3). Psc.Degree3Sector proves thm:deg23 (iii) on representatives: every root of chi(Phi_3 | im Q_3) is det M, im Q_3 lies in ker(Phi_3 - det M) over Q and rank Q_3 <= 2, given chi_M irreducible with two roots of modulus < 1 and the root bound of prop:cocycle (discharged for primitive sigma). Reductio lemmas; the only full control is degenerate. Psc.StrictSystem restates thm:deg23 (iii) on a strict system or component of first defect degree 3 over Fin 3 (StrictSystem.deg23_iii: given only M primitive, chi_M irreducible and a Pisot root; every structural hypothesis, including the first-defect selection, discharged), with the exclusion form no_strictSystem_deg3_of_not_eigen; Psc.Degree3Sector.finrank_ker_sub_det_eq_two gives dim_Q ker(Phi_3 - det M) = 2. No control meets the strict-system hypotheses; on 011/2/120 there is no strict system at all (Psc.StrictSystem.census_vacuous)."
