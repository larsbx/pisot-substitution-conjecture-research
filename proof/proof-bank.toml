[[lean_support]]
claim = "OrientationSpectrum"
coverage = "partial"
declarations = ["Psc.SignedCocycle.Normalisation.lift_eigen", "Psc.SignedCocycle.Normalisation.cocycle_spectral_bound", "Psc.SignedCocycle.Normalisation.cocycle_spectral_bound_rep", "Psc.SignedCocycle.Normalisation.rep_eigen", "Psc.SignedCocycle.Normalisation.ssign_abs_le", "Psc.ParikhIntertwiner.perron_root_childSystem", "Psc.CocycleSpectrum.cocycle_spectral_strict", "Psc.CocycleSpectrum.cocycle_primitive_extremal", "Psc.PerronExistence.cocycle_spectral_bound_of_primitive"]
note = "Lean proves the odd-sector lift of the signed cocycle S = A - B into the raw ordered (double-cover) state matrix, the Perron comparison rho(S) <= beta on normalised representatives (two routes), lambda N_C = beta lambda on representatives and |S| <= N_C. Psc.CocycleSpectrum adds the strict inequality when a pair occurs with both signs (given strong connectivity) and the primitive equality case S = +-D N_C D; Psc.PerronExistence supplies the positive left eigenvector for a primitive substitution. Not formalized: the imprimitive equality case; swap closure and children_swap are Normalisation hypotheses."
[[lean_support]]
claim = "ParikhIntertwiner"
coverage = "partial"
declarations = ["Psc.ParikhIntertwiner.pc_nc", "Psc.ParikhRank.prep_nrep", "Psc.ParikhRank.prep_surjective", "Psc.ParikhRank.card_rep_ge", "Psc.ParikhRank.charpoly_dvd_rep", "Psc.ParikhRank.charpoly_dvd_rep_int", "Psc.ParikhRank.similar_rep_of_equiv", "Psc.KernelCofactor.charpoly_nrep_eq_mul", "Psc.KernelCofactor.isCoprime_rep", "Psc.KernelCofactor.simple_perron_root_rep", "Psc.KernelCofactor.factor_through_rep", "Psc.PerronExistence.perron_root_rep_of_primitive"]
note = "Lean proves P_C N_C = M P_C on the raw ordered states and, for balanced states, on normalised representatives with N_C = A + B; and, assuming chi_M irreducible, C nonempty and nonempty top tracks: rank P_C = d, m >= d, chi_M | chi_{N_C} over Q and Z, and similarity to M when m = d. The double-cover m = d clause is vacuous under a normalisation (no_equiv_fin3). Also: chi_{N_C} = chi_M * chi_{N_C | ker P_C} with the factors coprime and beta a simple root of chi_{N_C} (given strong connectivity of N_C and l > 0), rho(N_C) = beta for a primitive substitution with balanced states, and Theorem A(iv) on representatives. Not formalized: that beta is the only eigenvalue of modulus beta; swap closure is a hypothesis here and is shown to be without loss of generality in Psc.Descendants; children_swap is derived for zero-return children (Psc.Reduction.redNormalisation)."
[[lean_support]]
claim = "DefectIntertwiner"
coverage = "partial"
declarations = ["Psc.SignedIntertwiner.k2_rep", "Psc.SignedIntertwiner.q2full_mul_ssign", "Psc.SignedIntertwiner.q2_mul_ssign", "Psc.SignedIntertwiner.k3_rep", "Psc.SignedIntertwiner.q3_mul_ssign", "Psc.SignedIntertwiner.q3_col_mem_lie3", "Psc.Lie3.k3Vec_mem_span_lyndon", "Psc.Lie3.phi3_mem_span", "Psc.LieWeights.charpoly_phi3Lie"]
note = "Lean proves Q_r S = Phi_r Q_r on normalised representatives for r = 2 (M (x) M on any finite alphabet; Lambda^2 M in wedge coordinates over Fin 3) and r = 3 (M^{(x)3}), assuming the lower defects vanish on every state, and that over Fin 3 the K_3 columns lie in Lie_3 (Ree at degree three on three letters, explicit Lyndon basis), which M^{(x)3} preserves. Also the weights of Phi_3 on Lie_3 for diagonalizable M (charpoly_phi3Lie). Not formalized: the first-defect selection, the diagonalization of M from irreducibility of chi_M, and thm:deg23 (iii) itself."
[[lean_support]]
claim = "OrientationMonodromy"
coverage = "partial"
declarations = ["Psc.CocycleSpectrum.exists_gauge_iff_closed_walks", "Psc.CocycleSpectrum.exists_gauge_iff", "Psc.CocycleSpectrum.cocycle_primitive_gauge", "Psc.CocycleSpectrum.choice_of_representatives"]
note = "Lean proves, on normalised representatives: a gauge exists iff every closed walk of the child graph has sign product +1 (given strong connectivity), iff S = D N_C D with D = diag(g); for primitive N_C an eigenvalue of modulus beta is beta (gauge) or -beta (anti-gauge); a different choice of representatives conjugates S by a diagonal sign matrix. Not formalized: the morphisms U, V with sigma o U = U o tau_C, the oriented double cover's strong connectivity and its morphism W."
[[lean_support]]
claim = "ParitySieve"
coverage = "partial"
declarations = ["Psc.Degree2Sector.charpoly_wedge2", "Psc.Degree2Sector.rank_q2", "Psc.Degree2Sector.charpoly_wedge2_dvd_ssign_int", "Psc.Degree2Sector.lcm_dvd_nrep_mod_two", "Psc.Degree2Sector.card_rep_ge_natDegree_lcm", "Psc.Degree2Sector.card_rep_ge_six"]
note = "Lean proves, for a normalisation over Fin 3 with balanced states, some kw != 0 and chi_M irreducible: rank Q2 = 3, chi_{Lambda^2 M} | chi_S over Q and Z, S = N_C mod 2, lcm(chi_M, chi_{Lambda^2 M}) | chi_{N_C} mod 2, |R| >= deg lcm, and |R| >= 6 when det M is odd and tr M != U mod 2; and chi_{Lambda^2 M} = X^3 - U X^2 + det(M) tr(M) X - det(M)^2 over any commutative ring. No control meets the full hypothesis set (a reductio lemma); plastic meets the matrix-level hypotheses. Not formalized: the eight-class parity table and rho(Lambda^2 M) = beta |beta_2|."
[[lean_support]]
