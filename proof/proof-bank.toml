coverage = "partial"
declarations = ["Psc.Defect4.k4_subst", "Psc.Defect4.k4_rep", "Psc.Defect4.q4_mul_ssign", "Psc.Defect4Lie.k4Vec_mem_span_lyndon4", "Psc.Defect4Lie.phi4Lie_k4Lie", "Psc.LieWeights.phi4_mem_span", "Psc.LieWeights.charpoly_phi4Lie_rat"]
note = "Lean proves the degree-4 first-defect intertwiner inputs: for 3-binomially equivalent states K_4(sigma u, sigma v) = M^{(x)4} K_4(u, v), Q_4 S = M^{(x)4} Q_4 on representatives, K_4 in Lie_4 over Fin 3 and Q_4 S = Phi_4 Q_4 with Phi_4 = M^{(x)4}|Lie_4, and the characteristic polynomial of the rational Phi_4 for diagonalizable M (Witt multiplicities 1, 1, 3 at shapes (3,1,0), (2,2,0), (2,1,1); 0 at (4,0,0)). Not formalized: the first-defect selection, the diagonalization of M from irreducibility of chi_M, and the link from charpoly_phi4Lie_rat to the weight eliminations of Psc.WeightModulus / Psc.GaloisOrbit."
[[lean_support]]
