name: C4 phase lattice index conservation

on:
  pull_request:
    paths:
      - '.github/workflows/c4-phase-lattice-index.yml'
      - 'docs/c4-phase-lattice-index-conservation-2026-11-04.md'
      - 'docs/side-notes-ledger.md'
      - 'proof/proof-bank.json'
      - 'docs/proof-bank.md'
      - 'kernel/psc/c4_phase_lattice_index.mojo'
      - 'kernel/tests/test_c4_phase_lattice_index.mojo'
      - 'tests/test_c4_phase_lattice_index_oracle.py'
      - 'kernel/pixi.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-phase-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently recompute all exact Smith-index and block packets
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_phase_lattice_index_oracle.py
      - name: Verify generated Proof Bank source statements
        run: python tools/make_proof_bank.py --check
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical Mojo phase-index gate
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_phase_lattice_index.mojo
