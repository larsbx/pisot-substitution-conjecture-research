name: Tier 2 Growth Bridge

on:
  push:
    paths:
      - "mojo/psc/tier2_loop_gain_fixture.mojo"
      - "mojo/tests/test_tier2_loop_gain_fixture.mojo"
      - "schemas/tier2-loop-gain-fixture.schema.json"
      - ".github/workflows/tier2-growth-bridge.yml"
  pull_request:
    paths:
      - "mojo/psc/tier2_loop_gain_fixture.mojo"
      - "mojo/tests/test_tier2_loop_gain_fixture.mojo"
      - "schemas/tier2-loop-gain-fixture.schema.json"
      - ".github/workflows/tier2-growth-bridge.yml"

jobs:
  tier2-exact-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: latest
          manifest-path: mojo/pixi.toml

      - name: Run Tier 2 Mojo fixture regression
        working-directory: mojo
        run: pixi run mojo run -I . tests/test_tier2_loop_gain_fixture.mojo

      - name: Validate Tier 2 fixture schema JSON
        run: python -m json.tool schemas/tier2-loop-gain-fixture.schema.json >/dev/null
