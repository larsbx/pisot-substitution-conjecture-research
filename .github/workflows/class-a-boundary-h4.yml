name: PSC class-A minus boundary H4 complete child star

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_boundary_h4_children.mojo'
      - 'kernel/tests/test_class_a_boundary_h4_children.mojo'
      - 'kernel/class_a_boundary_h4_children.mojo'
      - 'oracles/python/class_a_boundary_h4_children.py'
      - 'tests/test_class_a_boundary_h4_children.py'
      - 'docs/class-a-boundary-h4-2026-10-27.md'
      - '.github/workflows/class-a-boundary-h4.yml'
  workflow_dispatch:

jobs:
  exact-H4-star:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent literal ordered-children and exact rational geometry
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_h4_children.py
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical native polynomial and full Cartesian occurrence guards
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_class_a_boundary_e2_children.mojo
          pixi run --locked mojo run -I . tests/test_class_a_boundary_h4_children.mojo
          pixi run --locked mojo run -I . class_a_boundary_h4_children.mojo
