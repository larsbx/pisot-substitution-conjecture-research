name: PR487 merge repair and native acceptance

on:
  push:
    branches:
      - research/c4-return-induction-prefix-satellite-2026-11-04
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psc-pr487-integration
  cancel-in-progress: false

jobs:
  reconcile-and-verify:
    if: github.repository == 'larsbx/pisot-substitution-conjecture-research' && github.ref == 'refs/heads/research/c4-return-induction-prefix-satellite-2026-11-04'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence directory and test repair guards
        run: |
          mkdir -p "$RUNNER_TEMP/pr487-replay"
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_pr487_integration.py | tee "$RUNNER_TEMP/pr487-replay/repair-guards.log"
      - name: Reconcile only known conflicts and regenerate from combined sources
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -o pipefail
          python tools/reconcile_pr487.py prepare \
            --expected-head "$EXPECTED_HEAD" \
            --receipt "$RUNNER_TEMP/pr487-replay/integration.json" \
            --github-output "$GITHUB_OUTPUT" \
            2>&1 | tee "$RUNNER_TEMP/pr487-replay/integration.log"
      - name: Require exact integrated revision
        env:
          INTEGRATED_SHA: ${{ steps.integrate.outputs.integrated_sha }}
        run: test "$(git rev-parse HEAD)" = "$INTEGRATED_SHA"
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Native return-induction and boundary-carrier contracts
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo run -I . tests/test_c4_return_induction_prefix_satellite.mojo 2>&1 | tee "$RUNNER_TEMP/pr487-replay/native-return-induction.log"
          pixi run --locked mojo run -I . tests/test_c4_return_boundary_carrier.mojo 2>&1 | tee "$RUNNER_TEMP/pr487-replay/native-boundary-carrier.log"
      - name: Native complete overlap states occurrences and distances
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo run -I . tests/test_c4_return_overlap_closure.mojo 2>&1 | tee "$RUNNER_TEMP/pr487-replay/native-overlap.log"
      - name: Independent equality of the complete native and Python graphs
        run: |
          set -o pipefail
          python tests/test_c4_return_overlap_closure_oracle.py --native-log "$RUNNER_TEMP/pr487-replay/native-overlap.log" 2>&1 | tee "$RUNNER_TEMP/pr487-replay/full-graph-parity.log"
      - name: Preserve mainline regression and governance acceptance
        run: |
          set -o pipefail
          python -m pytest -q tests/test_c4_cut_pair_reduction_oracle.py tests/test_c4_pairwise_cut_frequency_oracle.py tests/test_c4_nonunit_residue_occupancy_oracle.py tests/test_c4_finite_cylinder_overlap_oracle.py 2>&1 | tee "$RUNNER_TEMP/pr487-replay/mainline-regressions.log"
          python tools/make_proof_bank.py --check 2>&1 | tee "$RUNNER_TEMP/pr487-replay/proof-bank.log"
          PYTHONPATH=tools python -m claim_governance.cli --root . 2>&1 | tee "$RUNNER_TEMP/pr487-replay/governance.log"
          python tools/check_markdown_source.py 2>&1 | tee "$RUNNER_TEMP/pr487-replay/markdown.log"
          git diff --check
      - name: Publish only the validated merge commit with an expected-head lease
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATED_SHA: ${{ steps.integrate.outputs.integrated_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$INTEGRATED_SHA"
          python tools/reconcile_pr487.py publish --receipt "$RUNNER_TEMP/pr487-replay/integration.json"
      - name: Retain complete source snapshots and exact revision identity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr487-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/pr487-replay/checked-head.txt"
          git status --porcelain > "$RUNNER_TEMP/pr487-replay/worktree-status.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr487-replay/checked-source.tar.gz"
          git archive --format=tar.gz origin/main > "$RUNNER_TEMP/pr487-replay/main-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr487-integration-${{ github.sha }}
          path: ${{ runner.temp }}/pr487-replay/
          if-no-files-found: error
