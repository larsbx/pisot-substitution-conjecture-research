name: PSC class-A U recovery 117-case independent replay

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_U_hit.py'
      - 'tests/test_class_a_boundary_U_hit_consolidation.py'
      - 'docs/class-a-boundary-U-hit-recovery-2026-10-31.md'
      - '.github/workflows/class-a-boundary-U-recovery.yml'
  workflow_dispatch:

jobs:
  exact-U-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent 117-member four-edge occurrence replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_U_hit_consolidation.py
