name: C4 pairwise strict cut frequency

on:
  pull_request:
    paths:
      - '.github/workflows/c4-pairwise-cut-frequency.yml'
      - 'docs/c4-every-cut-pair-positive-density-2026-11-04.md'
      - 'docs/side-notes-ledger.md'
      - 'kernel/tests/test_c4_pairwise_cut_frequency.mojo'
      - 'tests/test_c4_pairwise_cut_frequency_oracle.py'
      - 'kernel/pixi.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent strict word, exact Perron and closure oracle
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_pairwise_cut_frequency_oracle.py
      - name: Existing Proof Bank source inventory unchanged
        run: python tools/make_proof_bank.py --check
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical literal and cyclic matrix controls
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_pairwise_cut_frequency.mojo
