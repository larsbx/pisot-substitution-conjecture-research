name: C4 exact return-boundary carrier

on:
  pull_request:
    paths:
      - '.github/workflows/c4-return-boundary-carrier.yml'
      - 'docs/c4-return-boundary-carrier-2026-11-04.md'
      - 'kernel/psc/c4_return_boundary_carrier.mojo'
      - 'kernel/tests/test_c4_return_boundary_carrier.mojo'
      - 'tests/test_c4_return_boundary_carrier_oracle.py'
      - 'kernel/psc/c4_return_induction_prefix_satellite.mojo'
      - 'tests/test_c4_return_induction_prefix_satellite_oracle.py'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-boundary-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact-word regressions
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_return_induction_prefix_satellite_oracle.py tests/test_c4_return_boundary_carrier_oracle.py
      - name: Generated source inventory is current
        run: python tools/make_proof_bank.py --check
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical Mojo complete return-boundary replay
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_return_boundary_carrier.mojo
