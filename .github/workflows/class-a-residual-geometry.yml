name: Class-A residual geometry and d2 non-transfer

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_residual_geometry.mojo'
      - 'kernel/tests/test_class_a_residual_geometry.mojo'
      - 'kernel/class_a_residual_geometry.mojo'
      - 'oracles/python/class_a_residual_geometry.py'
      - 'tests/test_class_a_residual_geometry.py'
      - 'docs/class-a-residual-geometry-2026-10-22.md'
      - '.github/workflows/class-a-residual-geometry.yml'
  workflow_dispatch:

jobs:
  exact-residual-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent polynomial oracle
        run: python -m pip install 'pytest>=7'
      - name: Verify sparse symbolic polynomials and strict non-transfer
        run: |
          set -euo pipefail
          mkdir -p kernel/build/class-a-residual-geometry
          python oracles/python/class_a_residual_geometry.py 2>&1 | tee kernel/build/class-a-residual-geometry/oracle.log
          python -m pytest -q tests/test_class_a_residual_geometry.py 2>&1 | tee kernel/build/class-a-residual-geometry/pytest.log
      - name: Install Pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Verify canonical locked Mojo identities and geometric refusal
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          pixi run --locked mojo run -I . tests/test_class_a_residual_geometry.mojo 2>&1 | tee build/class-a-residual-geometry/mojo-tests.log
          pixi run --locked mojo run -I . class_a_residual_geometry.mojo 2>&1 | tee build/class-a-residual-geometry/driver.log
      - name: Preserve fresh reproducible receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-a-residual-geometry-receipts
          path: kernel/build/class-a-residual-geometry/
          if-no-files-found: warn
