name: C4 cut-pair combinatorics and source audit

on:
  pull_request:
    paths:
      - '.github/workflows/c4-cut-pair-reduction.yml'
      - 'docs/c4-cut-pair-productivity-2026-11-04.md'
      - 'kernel/psc/c4_cut_pair_reduction.mojo'
      - 'kernel/tests/test_c4_cut_pair_reduction.mojo'
      - 'tests/test_c4_cut_pair_reduction_oracle.py'
      - 'proof/proof-bank.json'
      - 'docs/proof-bank.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cut-pair-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head checkout lease
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent true-word cut pair oracle
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_cut_pair_reduction_oracle.py
      - name: Generated source statement inventory
        run: python tools/make_proof_bank.py --check
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Native bounded C4 cut-pair audit and failure controls
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_cut_pair_reduction.mojo
