name: Class-D plus positive-b chambers

on:
  pull_request:
    paths:
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'kernel/psc/**'
      - 'kernel/a1_normal_form_census.mojo'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/finite_graph/**'
      - 'kernel/finite_automata/**'
      - 'kernel/mojo_smoke/**'
      - 'vendored.toml'
      - 'kernel/symbolic_line_certificate.mojo'
      - 'kernel/class_d_plus_positive_b_chambers.mojo'
      - 'kernel/tests/test_class_d_plus_positive_b_chambers.mojo'
      - 'kernel/tests/test_class_d_chamber_sign.mojo'
      - 'kernel/tests/test_symbolic_line*.mojo'
      - 'docs/p1b-class-d-positive-b-wedge-2026-10-19.md'
      - '.github/workflows/class-d-plus-positive-b-chambers.yml'
  workflow_dispatch:

jobs:
  chambers:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Check exact lattice partition
        working-directory: kernel
        run: |
          set -o pipefail
          pixi install --locked 2>&1 | tee plus-install.log
          pixi run --locked mojo --version | tee plus-toolchain.log
          git rev-parse HEAD | tee plus-source.txt
          sha256sum pixi.lock class_d_plus_positive_b_chambers.mojo psc/symbolic_line.mojo >> plus-source.txt
          pixi run --locked mojo run -I . tests/test_class_d_plus_positive_b_chambers.mojo 2>&1 | tee plus-partition.log
          pixi run --locked mojo run -I . tests/test_class_d_chamber_sign.mojo 2>&1 | tee plus-sign-regression.log
          pixi run --locked mojo run -I . tests/test_symbolic_line_empty_blocks.mojo 2>&1 | tee plus-empty-blocks.log
      - name: Certify all plus chambers and boundary strips
        timeout-minutes: 150
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo build -I . class_d_plus_positive_b_chambers.mojo -o plus-chambers 2>&1 | tee plus-build.log
          ./plus-chambers 2>&1 | tee plus-chambers.log
          grep -F 'CLASS_D_PLUS_POSITIVE_B_CHAMBERS_CERTIFIED' plus-chambers.log
      - name: Inspect every component after a certificate refusal
        if: failure()
        working-directory: kernel
        run: |
          # A failed build/install is an environment blocker, not a component result.
          test -x ./plus-chambers || exit 1
          set -o pipefail
          set +e
          for k in 0 1 2 3 4; do
            timeout 600 stdbuf -oL -eL ./plus-chambers low "$k" > "plus-low-$k.log" 2>&1
            echo "low-$k exit=$?" | tee -a plus-components.tsv
          done
          timeout 600 stdbuf -oL -eL ./plus-chambers high > plus-high.log 2>&1
          echo "high exit=$?" | tee -a plus-components.tsv
          for j in 1 2 3 4 5 6; do
            timeout 600 stdbuf -oL -eL ./plus-chambers line "$j" > "plus-line-$j.log" 2>&1
            echo "line-$j exit=$?" | tee -a plus-components.tsv
          done
          # Diagnostic completion cannot turn the failed aggregate green.
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plus-positive-b-chamber-execution
          path: |
            kernel/plus-*.log
            kernel/plus-source.txt
            kernel/plus-components.tsv
          if-no-files-found: error
