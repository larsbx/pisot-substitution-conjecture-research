name: C4 direct source coincidence (021 and all 36 orders)
on:
  pull_request:
    paths:
      - '.github/workflows/c4-direct-source-coincidence.yml'
      - 'docs/c4-direct-source-coincidence-2026-11-04.md'
      - 'evidence/c4-direct-source-coincidence-2026-11-04/**'
      - 'kernel/psc/c4_direct_source_coincidence.mojo'
      - 'kernel/psc/c4_third_level_coincidence_family.mojo'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/tests/test_c4_direct_source_coincidence.mojo'
      - 'tests/test_c4_direct_source_coincidence_oracle.py'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-direct-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent positive certificates and original family regressions
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_direct_source_coincidence_oracle.py tests/test_c4_third_level_coincidence_family_oracle.py tests/test_c4_reversed_run_family_oracle.py
          python tests/test_c4_direct_source_coincidence_oracle.py > /tmp/c4-direct-source.json
          python -c "import json; a=json.load(open('evidence/c4-direct-source-coincidence-2026-11-04/receipt.json')); b=json.load(open('/tmp/c4-direct-source.json')); raise SystemExit(0 if a==b else 'certificate receipt mismatch')"
      - name: Generated inventory consistency (not proof endorsement)
        run: python tools/make_proof_bank.py --check
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Native positive source certificates and old family regression
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_c4_direct_source_coincidence.mojo
          pixi run --locked mojo run -I . tests/test_c4_third_level_coincidence_family.mojo
