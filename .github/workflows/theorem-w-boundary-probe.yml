name: Theorem W boundary-line probe (temporary)
# Temporary, PR #345 only. PR #288 (7a74eda) raised two wedge floors:
# wedge D -1 2 1 -2 2 1 -4 3 2 (a0 3 -> 7) and wedge D 4 1 3 5 1 3 7 1 4
# (b0 7 -> 31). Their new cores leave 28 boundary lines that were never
# certified. This probe certifies each of them once and records its verdict
# (the lines are not pinned yet, so the driver checks no pin). The verdicts
# are then pinned in kernel/symbolic_line_pins.txt, the lines move into
# class-b-lines-evidence.yml, and this file is deleted.
on:
  pull_request:
    paths:
      - '.github/workflows/theorem-w-boundary-probe.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: 'norm D 1 5 1 4 2 5' }
          - { line: 'norm D 1 7 1 6 2 8' }
          - { line: 'norm D 1 9 1 8 2 11' }
          - { line: 'norm D 1 11 1 10 2 14' }
          - { line: 'norm D 1 25 1 26 1 35' }
          - { line: 'norm D 1 28 1 29 1 39' }
          - { line: 'norm D 1 31 1 32 1 43' }
          - { line: 'norm D 1 34 1 35 1 47' }
          - { line: 'norm D 1 37 1 38 1 51' }
          - { line: 'norm D 1 40 1 41 1 55' }
          - { line: 'norm D 1 43 1 44 1 59' }
          - { line: 'norm D 1 46 1 47 1 63' }
          - { line: 'norm D 1 49 1 50 1 67' }
          - { line: 'norm D 1 52 1 53 1 71' }
          - { line: 'norm D 1 55 1 56 1 75' }
          - { line: 'norm D 1 58 1 59 1 79' }
          - { line: 'norm D 1 61 1 62 1 83' }
          - { line: 'norm D 1 64 1 65 1 87' }
          - { line: 'norm D 1 67 1 68 1 91' }
          - { line: 'norm D 1 70 1 71 1 95' }
          - { line: 'norm D 1 73 1 74 1 99' }
          - { line: 'norm D 1 76 1 77 1 103' }
          - { line: 'norm D 1 79 1 80 1 107' }
          - { line: 'norm D 1 82 1 83 1 111' }
          - { line: 'norm D 1 85 1 86 1 115' }
          - { line: 'norm D 1 88 1 89 1 119' }
          - { line: 'norm D 1 91 1 92 1 123' }
          - { line: 'norm D 1 94 1 95 1 127' }
    name: ${{ matrix.line }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Certify and record the verdict
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . symbolic_line_certificate.mojo ${{ matrix.line }} 2>&1 | tee line.log
          grep -F 'symbolic graph for every n >=' line.log
