name: Theorem W boundary-line probe (temporary)
# Temporary. PR #288 (7a74eda) raised two wedge floors, leaving 28 boundary
# lines that were never certified. Probe run 40485428677 certified 20; they are
# pinned in kernel/symbolic_line_pins.txt and run in class-b-lines-evidence.yml.
# The 8 below timed out at 5 hours: their symbolic parts certify, but deciding
# every member below the floor is slow since #288 made these floors grow like
# a^2. They run here at the 6-hour maximum and record the verdict (unpinned, so
# the driver checks no pin). Once all are pinned, this file is deleted.
on:
  pull_request:
    paths:
      - '.github/workflows/theorem-w-boundary-probe.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: 'norm D 1 70 1 71 1 95' }
          - { line: 'norm D 1 73 1 74 1 99' }
          - { line: 'norm D 1 79 1 80 1 107' }
          - { line: 'norm D 1 82 1 83 1 111' }
          - { line: 'norm D 1 85 1 86 1 115' }
          - { line: 'norm D 1 88 1 89 1 119' }
          - { line: 'norm D 1 91 1 92 1 123' }
          - { line: 'norm D 1 94 1 95 1 127' }
    name: ${{ matrix.line }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Certify and record the verdict
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . symbolic_line_certificate.mojo ${{ matrix.line }} 2>&1 | tee line.log
          grep -F 'symbolic graph for every n >=' line.log
