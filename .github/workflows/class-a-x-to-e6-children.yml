name: PSC class-A E6 eight children forward accessible from X

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_x_to_e6_children.py'
      - 'tests/test_class_a_x_to_e6_children.py'
      - 'docs/class-a-x-to-e6-children-2026-10-31.md'
      - '.github/workflows/class-a-x-to-e6-children.yml'
  workflow_dispatch:

jobs:
  e6-eight-child-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact two-chamber symbolic and independent Fraction child replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_x_to_e6_children.py
          python oracles/python/class_a_x_to_e6_children.py > /tmp/x-to-e6-children.json
