name: Theorem E line certificates
# Guards Theorems L, L' and L'' (docs/p1b-symbolic-line-2026-10-07.md,
# docs/p1-seed-strength-2026-10-08.md section 5,
# docs/p1b-boundary-hitting-progress-2026-10-08.md section 4): every line listed in
# certified_lines() of kernel/symbolic_line_certificate.mojo is certified again
# and must reproduce its pinned verdict (the driver raises otherwise). One job
# per line; the slowest take about half an hour.
on:
  pull_request:
    # The driver's full import closure, the pixi pins, and this file.
    paths:
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'kernel/a1_normal_form_census.mojo'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/psc/coincidence_formula.mojo'
      - 'kernel/psc/dumont_thomas.mojo'
      - 'kernel/psc/exact.mojo'
      - 'kernel/psc/field3.mojo'
      - 'kernel/psc/histogram.mojo'
      - 'kernel/psc/linear_numeration.mojo'
      - 'kernel/psc/numeration_addition.mojo'
      - 'kernel/psc/overlap_contracting.mojo'
      - 'kernel/psc/overlap_obstruction.mojo'
      - 'kernel/psc/overlap_seed_patch.mojo'
      - 'kernel/psc/perron_field3.mojo'
      - 'kernel/psc/perron_root_sign.mojo'
      - 'kernel/psc/pisot.mojo'
      - 'kernel/psc/pisot_screen.mojo'
      - 'kernel/psc/pisot_state.mojo'
      - 'kernel/psc/real_root_sign.mojo'
      - 'kernel/psc/symbolic_line.mojo'
      - 'kernel/psc/vertex_coincidence.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/symbolic_line_certificate.mojo'
      - 'kernel/finite_automata/**'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_graph/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - '.github/workflows/class-b-lines-evidence.yml'
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: 'B 2 2 1 0 1 1' }
          - { line: 'B 1 1 1 0 1 1' }
          - { line: 'B 1 2 1 0 1 1' }
          - { line: 'B 1 3 1 0 1 1' }
          - { line: 'B 1 1 1 0 1 -1' }
          - { line: 'B 1 2 1 0 1 -1' }
          - { line: 'B 1 3 1 0 1 -1' }
          - { line: 'B 2 0 1 0 1 1' }
          - { line: 'B 2 1 1 0 1 1' }
          - { line: 'B 2 3 1 0 1 1' }
          - { line: 'B 2 4 1 0 1 1' }
          - { line: 'B 2 0 1 0 1 -1' }
          - { line: 'B 2 1 1 0 1 -1' }
          - { line: 'B 2 2 1 0 1 -1' }
          - { line: 'B 2 3 1 0 1 -1' }
          - { line: 'A 2 0 1 0 1 -1' }
          - { line: 'A 2 0 1 0 1 1' }
          - { line: 'A 2 1 1 0 1 -1' }
          - { line: 'A 2 1 1 0 1 1' }
          - { line: 'A 2 2 1 0 1 -1' }
          - { line: 'A 2 2 1 0 1 1' }
          - { line: 'A 2 3 1 0 1 -1' }
          - { line: 'A 2 3 1 0 1 1' }
          - { line: 'C 1 1 1 0 1 -2' }
          - { line: 'C 1 1 1 0 1 0' }
          - { line: 'C 1 2 1 0 1 -3' }
          - { line: 'C 1 2 1 0 1 -1' }
          - { line: 'C 1 3 1 0 1 -4' }
          - { line: 'C 1 3 1 0 1 -2' }
          - { line: 'D 1 -1 1 0 1 -1' }
          - { line: 'D 1 -1 1 0 1 0' }
          - { line: 'D 1 -1 1 0 1 1' }
          - { line: 'D 1 -1 1 0 1 2' }
          - { line: 'D 1 -1 1 0 1 3' }
          - { line: 'D 1 -1 1 0 1 4' }
          - { line: 'D 1 -1 1 0 2 -3' }
          - { line: 'D 1 -1 1 0 2 -2' }
          - { line: 'D 1 1 1 0 1 -1' }
          - { line: 'D 1 1 1 0 1 0' }
          - { line: 'D 1 1 1 0 1 1' }
          - { line: 'D 1 1 1 0 1 2' }
          - { line: 'D 1 1 1 0 1 3' }
          - { line: 'D 1 1 1 0 1 4' }
          - { line: 'D 1 1 1 0 2 -1' }
          - { line: 'D 1 1 1 0 2 0' }
          - { line: 'D 1 1 1 0 2 1' }
          - { line: 'D 1 1 1 0 2 2' }
    name: line ${{ matrix.line }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Certify the line against its pinned verdict
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . symbolic_line_certificate.mojo ${{ matrix.line }} 2>&1 | tee line.log
          grep -Fx '  pinned verdict reproduced' line.log
