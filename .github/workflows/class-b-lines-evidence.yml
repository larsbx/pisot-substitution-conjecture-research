name: Theorem E line and wedge certificates
# Guards Theorems L, L', L'' and W (docs/p1b-symbolic-line-2026-10-07.md,
# docs/p1-seed-strength-2026-10-08.md section 5,
# docs/p1b-boundary-hitting-progress-2026-10-08.md sections 4 and 4b): every
# line listed in certified_lines() and every wedge listed in certified_wedges()
# of kernel/symbolic_line_certificate.mojo is certified again
# and must reproduce its pinned verdict (the driver raises otherwise). One job
# per line or wedge; the slowest lines take about half an hour, the slowest
# wedges a few hours.
on:
  pull_request:
    # The driver's full import closure, the pixi pins, and this file.
    paths:
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'kernel/a1_normal_form_census.mojo'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/psc/coincidence_formula.mojo'
      - 'kernel/psc/dumont_thomas.mojo'
      - 'kernel/psc/exact.mojo'
      - 'kernel/psc/field3.mojo'
      - 'kernel/psc/histogram.mojo'
      - 'kernel/psc/linear_numeration.mojo'
      - 'kernel/psc/numeration_addition.mojo'
      - 'kernel/psc/overlap_contracting.mojo'
      - 'kernel/psc/overlap_obstruction.mojo'
      - 'kernel/psc/overlap_seed_patch.mojo'
      - 'kernel/psc/perron_field3.mojo'
      - 'kernel/psc/perron_root_sign.mojo'
      - 'kernel/psc/pisot.mojo'
      - 'kernel/psc/pisot_screen.mojo'
      - 'kernel/psc/pisot_state.mojo'
      - 'kernel/psc/real_root_sign.mojo'
      - 'kernel/psc/symbolic_line.mojo'
      - 'kernel/psc/vertex_coincidence.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/symbolic_line_certificate.mojo'
      - 'kernel/finite_automata/**'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_graph/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - '.github/workflows/class-b-lines-evidence.yml'
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
jobs:
  line:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: 'B 2 2 1 0 1 1' }
          - { line: 'B 1 1 1 0 1 1' }
