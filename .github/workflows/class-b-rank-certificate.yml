name: Class-B piecewise rank certificate
on:
  pull_request:
    paths:
      - 'kernel/class_b_rank_certificate.mojo'
      - 'kernel/class_b_label_rays.mojo'
      - 'kernel/psc/class_b_rank_certificate.mojo'
      - 'kernel/tests/test_class_b_rank_certificate.mojo'
      - 'oracles/python/class_b_rank_*.py'
      - 'tests/test_class_b_rank_certificate.py'
      - 'evidence/class-b-rank-certificate-2026-10-27/**'
      - '.github/workflows/class-b-rank-certificate.yml'
  workflow_dispatch:
jobs:
  rank-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=7'
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Native contract, exact all-parameter checks of all 21 rays
        working-directory: kernel
        run: |
          P=../evidence/class-b-rank-certificate-2026-10-27
          mkdir -p build/class-b-rank build/edges
          pixi run --locked mojo run -I . tests/test_class_b_rank_certificate.mojo > build/class-b-rank/native-test.log
          pixi run --locked mojo build -I . class_b_rank_certificate.mojo -o build/rank-cert
          pixi run --locked mojo build -I . class_b_label_rays.mojo -o build/class-b-label-rays
          for cert in $P/certificates/*.cert; do
            ray=$(basename $cert .cert)
            build/rank-cert check $cert > build/class-b-rank/$ray.check.log
            cmp build/class-b-rank/$ray.check.log $P/logs/$ray.check.log
          done
      - name: Regenerate floor, first holdout and last member per ray; replay both checkers
        run: |
          P=evidence/class-b-rank-certificate-2026-10-27
          B=kernel/build/class-b-rank
          python - > $B/members.txt <<'PY'
          import json
          for r in json.load(open('evidence/class-b-rank-certificate-2026-10-27/rays.json')):
              first, last, _ = r['replayed']; holdout = r['training'][1] + r['gap']
              print(r['ray'], r['branch'], r['gap'], *sorted({first, holdout, last}))
          PY
          while read -r ray branch gap members; do
            for q in $members; do
              e=kernel/build/edges/$branch-g$gap-q$q.edges
              kernel/build/class-b-label-rays $branch $gap $q edges > $e
              (cd kernel/build/edges && grep " $branch-g$gap-q$q.edges\$" "$GITHUB_WORKSPACE/$P/edge-exports.sha256" | sha256sum -c)
              kernel/build/rank-cert replay $P/certificates/$ray.cert $e >> $B/$ray.replay.log
              grep "^RANK_REPLAY_PASS q $q " $P/logs/$ray.replay.log >> $B/$ray.expected.log
            done
            cmp $B/$ray.replay.log $B/$ray.expected.log
            python oracles/python/class_b_rank_certificate_oracle.py $P/certificates/$ray.cert $(for q in $members; do echo kernel/build/edges/$branch-g$gap-q$q.edges; done) > $B/$ray.oracle.log
            diff <(tail -n +2 $B/$ray.oracle.log | sed 's/^ORACLE_//') $B/$ray.replay.log
          done < $B/members.txt
          python -m pytest -q tests/test_class_b_rank_certificate.py
          (cd $P && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-b-rank-certificate
          path: kernel/build/class-b-rank/
