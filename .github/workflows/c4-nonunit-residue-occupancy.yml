name: C4 non-unit residue occupancy

on:
  pull_request:
    paths:
      - '.github/workflows/c4-nonunit-residue-occupancy.yml'
      - 'docs/c4-nonunit-residue-occupancy*.md'
      - 'docs/c4-nonunit-madic-counting-bridge-2026-11-04.md'
      - 'kernel/psc/c4_nonunit_residue_occupancy.mojo'
      - 'kernel/c4_nonunit_residue_occupancy.mojo'
      - 'kernel/tests/test_c4_nonunit_residue_occupancy.mojo'
      - 'tests/test_c4_nonunit_residue_occupancy_oracle.py'
      - 'kernel/psc/exact.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/mojo_smoke/**'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  residue-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical finite certificate and failure controls
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_nonunit_residue_occupancy.mojo
      - name: Emit complete literal residue table
        working-directory: kernel
        shell: bash
        run: pixi run --locked mojo run -I . c4_nonunit_residue_occupancy.mojo | tee /tmp/nonunit-residue-occupancy.txt
      - name: Independent rational inverse oracle and native table comparison
        env:
          PSC_OCCUPANCY_NATIVE_OUTPUT: /tmp/nonunit-residue-occupancy.txt
        run: python tests/test_c4_nonunit_residue_occupancy_oracle.py
      - name: Evidence surfaces
        run: |
          python tools/make_proof_bank.py --check
          PYTHONPATH=tools python -m claim_governance.cli --root .
          python tools/check_markdown_source.py
