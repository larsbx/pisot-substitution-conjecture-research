name: Class-D minus recurrent carrier

on:
  pull_request:
    paths:
      - 'oracles/python/class_d_positive_b_recurrent_support.py'
      - 'tests/test_class_d_positive_b_recurrent_support.py'
      - 'evidence/class-d-target-spine-2026-10-14/**'
      - 'reference/psc_research/overlap_graph.py'
      - 'reference/psc_research/overlap_obstruction.py'
      - '.github/workflows/class-d-minus-recurrent-carrier.yml'
  workflow_dispatch:

jobs:
  recurrent-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact recurrent-support calibration
        run: |
          set -o pipefail
          python3 oracles/python/class_d_positive_b_recurrent_support.py > recurrent-support.json
          python3 -m pytest -q tests/test_class_d_positive_b_recurrent_support.py
