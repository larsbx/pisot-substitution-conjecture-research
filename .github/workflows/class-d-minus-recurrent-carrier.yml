name: Class-D minus recurrent reduction

on:
  pull_request:
    paths:
      - 'oracles/python/class_d_positive_b_recurrent_support.py'
      - 'oracles/python/class_d_minus_shared_cycles.py'
      - 'oracles/python/class_d_minus_high_sum_cycles.py'
      - 'tests/test_class_d_minus_high_sum_cycles.py'
      - 'oracles/python/class_d_minus_seed_cover.py'
      - 'tests/test_class_d_minus_seed_cover.py'
      - 'oracles/python/class_d_minus_boundary_strips.py'
      - 'tests/test_class_d_minus_boundary_strips.py'
      - 'tests/test_class_d_positive_b_recurrent_support.py'
      - 'tests/test_class_d_minus_shared_cycles.py'
      - 'evidence/class-d-target-spine-2026-10-14/**'
      - 'reference/psc_research/overlap_graph.py'
      - 'reference/psc_research/overlap_obstruction.py'
      - 'kernel/**'
      - '.github/workflows/class-d-minus-recurrent-carrier.yml'
  workflow_dispatch:

env:
  MODULAR_TELEMETRY_ENABLED: 'false'
  MODULAR_CRASH_REPORTING_ENABLED: 'false'

concurrency:
  # A newer commit on the same branch or pull request supersedes this run's
  # queued and in-progress checks. Runs on main get a group of their own, so
  # every main commit keeps its receipts.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  recurrent-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent calibration dependencies
        run: python -m pip install pytest
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical exact recurrent-support calibration
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_recurrent_support.mojo 2>&1 | tee ../recurrent-tests.log
          pixi run mojo run -I . class_d_minus_recurrent_support.mojo 2>&1 | tee ../recurrent-mojo.log
          grep -F 'CLASS_D_MINUS_RECURRENT_FINITE_CALIBRATION_OK specimens=56 uniform_theorem=false' ../recurrent-mojo.log
      - name: Independent exact Q(beta) calibration and agreement
        run: |
          set -o pipefail
          python oracles/python/class_d_positive_b_recurrent_support.py --mojo-log recurrent-mojo.log | tee recurrent-support.json
      - name: Classification and counterexample regressions
        if: always()
        env:
          CLASS_D_ORACLE_REPORT: recurrent-support.json
          CLASS_D_MOJO_LOG: recurrent-mojo.log
        run: |
          set -o pipefail
          python -m pytest -q tests/test_class_d_positive_b_recurrent_support.py tests/test_class_d_minus_shared_cycles.py 2>&1 | tee recurrent-pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minus-recurrent-support-replay
          path: |
            recurrent-*.log
            recurrent-support.json
          if-no-files-found: warn

  conditional-cycle-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install high-sum calibration dependencies
        run: python -m pip install pytest
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Verify guarded cycle superset and exceptional exits
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_cycle_reduction.mojo 2>&1 | tee minus-cycle-tests.log
          pixi run mojo run -I . class_d_minus_cycle_reduction.mojo 2>&1 | tee minus-cycle-reduction.log
          grep -F 'CLASS_D_MINUS_POSITIVE_B_CYCLE_REDUCTION_CERTIFIED' minus-cycle-reduction.log
      - name: Verify shared-parameter cycle guards
        if: always()
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_shared_cycles.mojo 2>&1 | tee minus-shared-cycle-tests.log
          pixi run mojo run -I . class_d_minus_shared_cycles.mojo 2>&1 | tee minus-shared-cycle.log
          grep -F 'CLASS_D_MINUS_SHARED_CYCLE_CONTROLS_OK CycleSum=separate_seed_cover' minus-shared-cycle.log
      - name: Verify unbounded six-edge family identity
        if: always()
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_cycle_family.mojo 2>&1 | tee minus-cycle-family-tests.log
          pixi run mojo run -I . class_d_minus_cycle_family.mojo 2>&1 | tee minus-cycle-family.log
          grep -F 'SIX_EDGE_FAMILY_REFUTED all_integer_k_ge_2=true k_cap=none rows=0,5 sum=-7-u CycleSum=separate_seed_cover' minus-cycle-family.log
      - name: Verify uniform seed carrier and CycleSum on the minus residual
        if: always()
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_seed_cover.mojo 2>&1 | tee minus-seed-cover-tests.log
          pixi run mojo run -I . class_d_minus_seed_cover.mojo 2>&1 | tee minus-seed-cover.log
          python ../oracles/python/class_d_minus_seed_cover.py --mojo-log minus-seed-cover.log | tee minus-seed-cover.json
          CLASS_D_SEED_COVER_REPORT=minus-seed-cover.json CLASS_D_SEED_COVER_MOJO_LOG=minus-seed-cover.log python -m pytest -q ../tests/test_class_d_minus_seed_cover.py 2>&1 | tee minus-seed-cover-python-tests.log
      - name: Certify the complete minus residual including both omitted strips
        if: always()
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo run -I . tests/test_class_d_minus_boundary_strips.mojo 2>&1 | tee minus-complete-tests.log
          grep -F 'CLASS_D_MINUS_RESIDUAL_BH_CERTIFIED a>=0 b>=0 components=4 universal_139=open' minus-complete-tests.log
          python ../oracles/python/class_d_minus_boundary_strips.py --mojo-log minus-complete-tests.log | tee minus-strips-calibration.json
          CLASS_D_MINUS_STRIPS_REPORT=minus-strips-calibration.json CLASS_D_MINUS_COMPLETE_LOG=minus-complete-tests.log python -m pytest -q ../tests/test_class_d_minus_boundary_strips.py 2>&1 | tee minus-strips-python-tests.log
      - name: Verify genuine higher-sum formal cycles and finite seed nonmembership
        if: always()
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_high_sum_cycles.mojo 2>&1 | tee minus-high-sum-tests.log
          pixi run mojo run -I . class_d_minus_high_sum_cycles.mojo 2>&1 | tee minus-high-sum.log
          python ../oracles/python/class_d_minus_high_sum_cycles.py --mojo-log minus-high-sum.log | tee minus-high-sum.json
          CLASS_D_HIGH_SUM_REPORT=minus-high-sum.json python -m pytest -q ../tests/test_class_d_minus_high_sum_cycles.py 2>&1 | tee minus-high-sum-python-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minus-conditional-reduction-replay
          path: |
            kernel/minus-*.log
            kernel/minus-high-sum.json
            kernel/minus-seed-cover.json
            kernel/minus-strips-calibration.json
          if-no-files-found: warn
