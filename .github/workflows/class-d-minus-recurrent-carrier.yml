name: Class-D minus recurrent carrier

on:
  pull_request:
    paths:
      - 'oracles/python/class_d_positive_b_recurrent_support.py'
      - 'tests/test_class_d_positive_b_recurrent_support.py'
      - 'evidence/class-d-target-spine-2026-10-14/**'
      - 'reference/psc_research/overlap_graph.py'
      - 'reference/psc_research/overlap_obstruction.py'
      - 'kernel/psc/class_d_minus_cycle_superset.mojo'
      - 'kernel/psc/class_d_minus_exceptional_cycles.mojo'
      - 'kernel/class_d_minus_cycle_reduction.mojo'
      - 'kernel/tests/test_class_d_minus_cycle_reduction.mojo'
      - 'kernel/psc/class_d_positive_b_geometry.mojo'
      - 'kernel/psc/class_d_positive_b_spine.mojo'
      - '.github/workflows/class-d-minus-recurrent-carrier.yml'
  workflow_dispatch:

jobs:
  recurrent-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact recurrent-support calibration
        run: |
          set -o pipefail
          python3 oracles/python/class_d_positive_b_recurrent_support.py > recurrent-support.json
          python3 -m pytest -q tests/test_class_d_positive_b_recurrent_support.py

  conditional-cycle-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Verify guarded cycle superset and exceptional exits
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_cycle_reduction.mojo
          pixi run mojo run -I . class_d_minus_cycle_reduction.mojo 2>&1 | tee minus-cycle-reduction.log
          grep -F 'CLASS_D_MINUS_POSITIVE_B_CYCLE_REDUCTION_CERTIFIED' minus-cycle-reduction.log
