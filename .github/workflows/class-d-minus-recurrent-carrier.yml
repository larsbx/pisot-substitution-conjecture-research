name: Class-D minus recurrent reduction

on:
  pull_request:
    paths:
      - 'oracles/python/class_d_positive_b_recurrent_support.py'
      - 'oracles/python/class_d_minus_shared_cycles.py'
      - 'tests/test_class_d_positive_b_recurrent_support.py'
      - 'tests/test_class_d_minus_shared_cycles.py'
      - 'evidence/class-d-target-spine-2026-10-14/**'
      - 'reference/psc_research/overlap_graph.py'
      - 'reference/psc_research/overlap_obstruction.py'
      - 'kernel/**'
      - '.github/workflows/class-d-minus-recurrent-carrier.yml'
  workflow_dispatch:

env:
  MODULAR_TELEMETRY_ENABLED: 'false'
  MODULAR_CRASH_REPORTING_ENABLED: 'false'

jobs:
  recurrent-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent calibration dependencies
        run: python -m pip install pytest
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical exact recurrent-support calibration
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_recurrent_support.mojo 2>&1 | tee ../recurrent-tests.log
          pixi run mojo run -I . class_d_minus_recurrent_support.mojo 2>&1 | tee ../recurrent-mojo.log
          grep -F 'CLASS_D_MINUS_RECURRENT_FINITE_CALIBRATION_OK specimens=56 uniform_theorem=false' ../recurrent-mojo.log
      - name: Independent exact Q(beta) calibration and agreement
        run: |
          set -o pipefail
          python oracles/python/class_d_positive_b_recurrent_support.py --mojo-log recurrent-mojo.log | tee recurrent-support.json
      - name: Classification and counterexample regressions
        if: always()
        env:
          CLASS_D_ORACLE_REPORT: recurrent-support.json
          CLASS_D_MOJO_LOG: recurrent-mojo.log
        run: |
          set -o pipefail
          python -m pytest -q tests/test_class_d_positive_b_recurrent_support.py tests/test_class_d_minus_shared_cycles.py 2>&1 | tee recurrent-pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minus-recurrent-support-replay
          path: |
            recurrent-*.log
            recurrent-support.json
          if-no-files-found: warn

  conditional-cycle-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Verify guarded cycle superset and exceptional exits
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_cycle_reduction.mojo 2>&1 | tee minus-cycle-tests.log
          pixi run mojo run -I . class_d_minus_cycle_reduction.mojo 2>&1 | tee minus-cycle-reduction.log
          grep -F 'CLASS_D_MINUS_POSITIVE_B_CYCLE_REDUCTION_CERTIFIED' minus-cycle-reduction.log
      - name: Verify shared-parameter cycle guards
        if: always()
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_minus_shared_cycles.mojo 2>&1 | tee minus-shared-cycle-tests.log
          pixi run mojo run -I . class_d_minus_shared_cycles.mojo 2>&1 | tee minus-shared-cycle.log
          grep -F 'CLASS_D_MINUS_SHARED_CYCLE_CONTROLS_OK CycleSum=open' minus-shared-cycle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minus-conditional-reduction-replay
          path: kernel/minus-*.log
          if-no-files-found: warn
