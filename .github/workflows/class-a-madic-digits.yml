name: PSC Class-A finite-place parity digit ladder

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_madic_digits.mojo'
      - 'kernel/tests/test_class_a_madic_digits.mojo'
      - 'tests/test_class_a_madic_digits_oracle.py'
      - 'docs/class-a-madic-digit-ladder-2026-11-02.md'
      - '.github/workflows/class-a-madic-digits.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-madic-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact PR head
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent integer Cramer oracle
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_class_a_madic_digits_oracle.py
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical locked Mojo verification
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_class_a_madic_digits.mojo
