name: C4 degree2 three-state census

on:
  push:
  pull_request:

jobs:
  degree2-three-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Exact three-state degree2 necessary-condition census
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . degree2_three_state_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Fx 'PIP specimens: 4554' <<<"$out"
          grep -Fx 'three-state parity survivors: 1716' <<<"$out"
          grep -Fx 'parity survivors with both endpoint maps nonsynchronizing: 570' <<<"$out"
          grep -Fx 'survive trace k<=1: 1716' <<<"$out"
          grep -Fx 'survive trace k<=2 plus mod4: 1716' <<<"$out"
          grep -Fx 'survive trace k<=3: 1662' <<<"$out"
          grep -Fx 'survive trace k<=6: 1662' <<<"$out"
          grep -Fx 'survive trace k<=12: 1554' <<<"$out"
          grep -Fx 'survive parity + nonsync endpoints + trace k<=12: 546' <<<"$out"
          grep -Fx 'combined survivors with capped BPA: 0' <<<"$out"
          grep -Fx 'combined survivors with recurrent size-3 SCC: 0' <<<"$out"
          grep -Fx 'combined survivors with sink size-3 SCC: 0' <<<"$out"
          grep -Fx 'minimum recurrent SCC size among combined survivors: 4' <<<"$out"
          grep -Fx 'minimum sink SCC size among combined survivors: 4' <<<"$out"
          grep -Fx 'first failure at k=3: 54' <<<"$out"
          grep -Fx 'first failure at k=7: 108' <<<"$out"
          grep -F '"T": 1 ,"U": -1 ,"d": 1' <<<"$out"
          grep -F '"plus": 6 ,"minus": 5' <<<"$out"
