name: PSC class-A B4 R4 recovered selected exits

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_b4_r4_exit_recovery.py'
      - 'tests/test_class_a_boundary_b4_r4_exit_recovery.py'
      - 'docs/class-a-boundary-b4-r4-exit-recovery-2026-10-31.md'
      - '.github/workflows/class-a-boundary-b4-r4-exit-recovery.yml'
  workflow_dispatch:

jobs:
  recover-b4-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact all-parameter occurrence proofs and original Fraction oracle
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_b4_r4_exit_recovery.py
          python oracles/python/class_a_boundary_b4_r4_exit_recovery.py > /tmp/psc-b4-r4-exits.json
