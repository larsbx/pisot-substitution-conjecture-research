name: Plus-Class-A eight upper-cycle exits

on:
  pull_request:
    paths:
      - '.github/workflows/class-a-plus-upper-cycles.yml'
      - 'kernel/psc/**'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/mojo_smoke/**'
      - 'kernel/a1_normal_form_census.mojo'
      - 'kernel/tests/test_class_a_plus_upper_cycles.mojo'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'oracles/python/class_a_plus_upper*.py'
      - 'tests/test_class_a_plus_upper*.py'
      - 'tools/run_class_a_plus_upper_native.py'
      - 'tools/setup_lean.sh'
      - 'tools/check_class_a_plus_upper*'
      - 'tools/make_proof_bank.py'
      - 'proof/PscVerif/**'
      - 'proof/proof-bank.json'
      - 'docs/proof-bank.md'
      - 'docs/class-a-plus-upper*.md'
      - 'docs/bh-class-a-plus-upper*.md'
      - 'evidence/class-a-plus-upper-cycles-2026-11-15/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/class-a-plus-upper-cycles.yml'
      - 'kernel/psc/class_a_plus_upper_cycles.mojo'
      - 'kernel/tests/test_class_a_plus_upper_cycles.mojo'
      - 'oracles/python/class_a_plus_upper*.py'
      - 'tests/test_class_a_plus_upper*.py'
      - 'tools/run_class_a_plus_upper_native.py'
      - 'tools/setup_lean.sh'
      - 'tools/check_class_a_plus_upper*'
      - 'proof/PscVerif/PscVerif/ClassAPlusUpperCycles.lean'
      - 'proof/PscVerif/ClassAPlusUpperCyclesAudit.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  literal-replay:
    name: Canonical paths and independent exact replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind producing revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/upper-native"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/upper-native/revision.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==8.4.2' 'sympy==1.14.0'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.84.2
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical bounded Mojo construction
        run: python tools/run_class_a_plus_upper_native.py --output-prefix "$RUNNER_TEMP/upper-native/native"
      - name: Independent exact, symbolic and refusal checks
        shell: bash
        env:
          PSC_UPPER_NATIVE: ${{ runner.temp }}/upper-native/native.log
        run: |
          set -euo pipefail
          python oracles/python/class_a_plus_upper_cycles.py --native "$PSC_UPPER_NATIVE" > "$RUNNER_TEMP/upper-native/native-replay.json"
          python oracles/python/class_a_plus_upper_symbolic.py > "$RUNNER_TEMP/upper-native/symbolic.json"
          python oracles/python/class_a_plus_upper_independent.py --output-dir "$RUNNER_TEMP/upper-native/independent" > "$RUNNER_TEMP/upper-native/independent-summary.json"
          python -m pytest -o addopts='' -q tests/test_class_a_plus_upper_cycles.py tests/test_class_a_plus_upper_symbolic.py tests/test_class_a_plus_upper_audit.py --junitxml="$RUNNER_TEMP/upper-native/pytest.xml" | tee "$RUNNER_TEMP/upper-native/pytest.log"
          python tools/make_proof_bank.py --check
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upper-cycles-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/upper-native
          if-no-files-found: error
          retention-days: 30

  isolated-lean:
    name: Fresh ordered-occurrence Lean endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind producing revision and provision pinned Lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/upper-lean"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/upper-lean/revision.txt"
          ./tools/setup_lean.sh --toolchain-only
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fresh source build and exact endpoint/axiom audit
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_class_a_plus_upper_cycles.sh | tee "$RUNNER_TEMP/upper-lean/fresh-gate.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upper-cycles-lean-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/upper-lean
          if-no-files-found: error
          retention-days: 30
