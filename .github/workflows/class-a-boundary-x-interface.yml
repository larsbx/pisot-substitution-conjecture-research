name: PSC class-A X first-choice proof dependency audit

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_x_interface_audit.py'
      - 'tests/test_class_a_boundary_x_interface_audit.py'
      - 'docs/class-a-boundary-x-interface-2026-10-31.md'
      - '.github/workflows/class-a-boundary-x-interface.yml'
  workflow_dispatch:

jobs:
  source-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact X outgoing census and main-only selected path replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_x_interface_audit.py
          python oracles/python/class_a_boundary_x_interface_audit.py > /tmp/x-interface.json
