name: C4 two-tail uniform word certificates
on:
  pull_request:
    paths:
      - '.github/workflows/c4-two-tail-uniform.yml'
      - 'docs/c4-two-tail-uniform-integration-2026-11-06.md'
      - 'experiments/c4_two_tail_uniform/**'
      - 'tools/check_c4_two_tail_uniform_bundle.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/c4-two-tail-uniform.yml'
      - 'docs/c4-two-tail-uniform-integration-2026-11-06.md'
      - 'experiments/c4_two_tail_uniform/**'
      - 'tools/check_c4_two_tail_uniform_bundle.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-word-proof-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install finite replay dependencies
        run: python -m pip install 'pytest==9.0.2' 'sympy==1.14.0'
      - name: Authenticate original bundle and independently replay
        run: python tools/check_c4_two_tail_uniform_bundle.py --output "$RUNNER_TEMP/c4-two-tail-replay"
      - name: Existing generated Proof Bank consistency
        run: python tools/make_proof_bank.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-two-tail-replay-${{ github.sha }}
          path: ${{ runner.temp }}/c4-two-tail-replay
          if-no-files-found: warn
