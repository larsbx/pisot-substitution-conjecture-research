name: Class-A uniform forward closure

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_uniform_closure.mojo'
      - 'kernel/psc/class_a_typed_carrier.mojo'
      - 'kernel/psc/class_a_uniform_geometry.mojo'
      - 'kernel/tests/test_class_a_uniform_closure.mojo'
      - 'kernel/class_a_uniform_closure.mojo'
      - 'oracles/python/class_a_uniform_closure.py'
      - 'tests/test_class_a_uniform_closure.py'
      - 'docs/class-a-uniform-forward-closure-2026-10-22.md'
      - '.github/workflows/class-a-uniform-forward-closure.yml'
  workflow_dispatch:

jobs:
  exact-forward-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent exact oracle
        run: python -m pip install 'pytest>=7'
      - name: Independent all-n affine transfer and rational finite-prefix audit
        run: |
          set -euo pipefail
          mkdir -p kernel/build/class-a-uniform-closure
          python oracles/python/class_a_uniform_closure.py 2>&1 | tee kernel/build/class-a-uniform-closure/oracle.log
          python -m pytest -q tests/test_class_a_uniform_closure.py 2>&1 | tee kernel/build/class-a-uniform-closure/python-tests.log
      - name: Install Pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Locked canonical all-n closure and negative controls
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          pixi run --locked mojo run -I . tests/test_class_a_uniform_closure.mojo 2>&1 | tee build/class-a-uniform-closure/mojo-tests.log
          pixi run --locked mojo run -I . class_a_uniform_closure.mojo 2>&1 | tee build/class-a-uniform-closure/driver.log
      - name: Preserve reproducible exact certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-a-uniform-closure-receipts
          path: kernel/build/class-a-uniform-closure/
          if-no-files-found: warn
