permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  isolated-lean:
    name: Fresh periodic partner Lean acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact revision and provision pinned Lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/periodic-partner"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/periodic-partner/revision.txt"
          ./tools/setup_lean.sh --toolchain-only
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Isolated source build and complete scoped axiom audit
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_c4_periodic_partner.sh 2>&1 | tee "$RUNNER_TEMP/periodic-partner/fresh-gate.log"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: periodic-partner-lean-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/periodic-partner
          if-no-files-found: error
          retention-days: 30
