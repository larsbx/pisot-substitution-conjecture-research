name: PSC class-A CY every-first-choice typed paths

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_cy_every_child.py'
      - 'tests/test_class_a_boundary_cy_every_child.py'
      - 'docs/class-a-boundary-cy-every-child-2026-10-31.md'
      - '.github/workflows/class-a-boundary-cy-every-child.yml'
  workflow_dispatch:

jobs:
  six-label-typed-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently replay every actual CY first choice and both reversals
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_cy_children.py tests/test_class_a_boundary_cy_every_child.py
          python oracles/python/class_a_boundary_cy_every_child.py > /tmp/cy-all-child.json
