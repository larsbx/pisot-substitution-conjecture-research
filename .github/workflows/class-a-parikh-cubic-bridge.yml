name: PSC exact minus-class-A Parikh cubic-field bridge

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_parikh_field_bridge.mojo'
      - 'kernel/tests/test_class_a_parikh_field_bridge.mojo'
      - 'reference/psc_research/class_a_parikh_field_bridge.py'
      - 'tests/test_class_a_parikh_field_bridge.py'
      - 'docs/class-a-parikh-cubic-bridge-2026-10-31.md'
      - '.github/workflows/class-a-parikh-cubic-bridge.yml'
  workflow_dispatch:

jobs:
  exact-parikh-field:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested revision and source hashes
        run: |
          mkdir -p acceptance
          git rev-parse HEAD > acceptance/tested-head.txt
          sha256sum kernel/pixi.lock kernel/psc/class_a_parikh_field_bridge.mojo kernel/tests/test_class_a_parikh_field_bridge.mojo kernel/psc/perron_field3.mojo kernel/psc/overlap_seed_patch.mojo > acceptance/source-sha256.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact independent full-Parikh lattice and literal-word checks
        run: |
          python -m pip install 'pytest>=7'
          set -o pipefail
          python -m pytest -q tests/test_class_a_parikh_field_bridge.py | tee acceptance/python.log
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical Mojo exact cubic-field and indexed-child bridge
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo --version | tee ../acceptance/mojo-version.txt
          pixi run --locked mojo run -I . tests/test_class_a_parikh_field_bridge.mojo | tee ../acceptance/parikh-mojo.log
          grep -Fqx 'CLASS_A_PARIKH_FIELD_BRIDGE_EXACT_PASS 6125' ../acceptance/parikh-mojo.log
          grep -Fqx 'contract-receipt: minus class-A regression specimens: research-normalized Parikh lattice inverse, beta intertwining, supplied-prefix transport and invalid-input refusal' ../acceptance/parikh-mojo.log
      - name: Claim governance coverage declarations
        run: |
          set -o pipefail
          PYTHONPATH=tools python -m claim_governance.cli --root . --check coverage | tee acceptance/coverage.log
      - name: Preserve exact-head acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-a-parikh-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: acceptance/
          if-no-files-found: error
