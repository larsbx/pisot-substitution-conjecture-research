name: PSC research checks

on:
  push:
  pull_request:

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Issue 45 source snapshots
        run: ./scripts/verify_all.sh provenance

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: pip install -e .[dev]
      - run: pytest

  mojo-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical Mojo regression tests
        working-directory: mojo
        run: pixi run test
      - name: Certificate checks
        working-directory: mojo
        run: pixi run verify
      - name: Alphabet-3 census regression
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Eq '^PIP specimens \(images of length <= 3\):[[:space:]]+4554$' <<<"$out"
          grep -Eq '^[[:space:]]*B_sigma construction terminated:[[:space:]]+4554[[:space:]]+capped:[[:space:]]+0$' <<<"$out"
          grep -Eq '^[[:space:]]*productive:[[:space:]]+4554[[:space:]]+non-productive:[[:space:]]+0$' <<<"$out"

  c3-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: C3 exact local census
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . c3_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Eq '^PIP specimens:[[:space:]]+4554[[:space:]]+capped:[[:space:]]+0$' <<<"$out"
          grep -Eq '^recurrent noncoincident SCCs:[[:space:]]+5022[[:space:]]+states:[[:space:]]+369486$' <<<"$out"
          grep -Eq '^SCCs with newborn synchronization:[[:space:]]+4962$' <<<"$out"
          grep -Eq '^SCCs without newborn synchronization:[[:space:]]+60$' <<<"$out"
          grep -Eq '^SCCs with inherited synchronization:[[:space:]]+4614$' <<<"$out"
          grep -Eq '^SCCs with both lineages synchronizing:[[:space:]]+4614$' <<<"$out"
          grep -Eq '^SCCs with neither lineage synchronizing:[[:space:]]+60$' <<<"$out"
          grep -Eq '^SCCs with clean-newborn state:[[:space:]]+1614$' <<<"$out"
          grep -Eq '^states with newborn synchronization:[[:space:]]+305730$' <<<"$out"
          grep -Eq '^states with inherited synchronization:[[:space:]]+171948$' <<<"$out"
          grep -Eq '^states with clean-newborn synchronization:[[:space:]]+141684$' <<<"$out"
          grep -Eq '^no-sync SCCs that are singleton:[[:space:]]+60$' <<<"$out"
          grep -Eq '^no-sync SCCs with direct coincidence sibling:[[:space:]]+0$' <<<"$out"
          grep -Eq '^no-sync SCCs with noncoincident exit:[[:space:]]+60$' <<<"$out"
          grep -Eq '^no-sync closed/no-direct-coincidence candidates:[[:space:]]+0$' <<<"$out"

  c4-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: C4 exact endpoint-type sink-SCC census
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . c4_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Fx 'PIP specimens: 4554  capped: 0' <<<"$out"
          grep -Fx 'degree4 unimodular PIP: 2628' <<<"$out"
          grep -Fx 'degree4 nonunimodular PIP: 1926' <<<"$out"
          grep -Fx 'degree4 unimodular three-real-root PIP: 648' <<<"$out"
          grep -Fx 'degree4 unimodular complex-pair PIP: 1980' <<<"$out"
          grep -Fx 'PIP cubics with zero discriminant: 0' <<<"$out"
          grep -Fx 'recurrent noncoincident SCCs: 5022' <<<"$out"
          grep -Fx 'noncoincident sink SCCs: 4554' <<<"$out"
          grep -Fx 'uncapped PIP with zero sink SCCs: 0' <<<"$out"
          grep -Fx 'uncapped PIP with exactly one sink SCC: 4554' <<<"$out"
          grep -Fx 'uncapped PIP with multiple sink SCCs: 0' <<<"$out"
          grep -Fx 'maximum sink SCCs per uncapped PIP: 1' <<<"$out"
          grep -Fx 'sink SCCs with direct coincidence child: 4554' <<<"$out"
          grep -Fx 'sink SCCs without direct coincidence child: 0' <<<"$out"
          grep -Fx 'sink SCCs with newborn synchronization: 4554' <<<"$out"
          grep -Fx 'sink SCCs with inherited synchronization: 4278' <<<"$out"
          grep -Fx 'sink SCCs with any boundary synchronization: 4554' <<<"$out"
          grep -Fx 'sink SCCs with no boundary synchronization: 0' <<<"$out"
          matrix='48,192,72,6,24,84,150,192,348,198,6,120,318,138,72,198,30,0,30,228,222,6,6,0,0,0,24,24,24,120,30,0,12,42,66,84,318,228,24,42,48,90,150,138,222,24,66,90,0'
          grep -Fx "PIP_TYPE_MATRIX $matrix" <<<"$out"
          grep -Fx "SINK_TYPE_MATRIX $matrix" <<<"$out"

  tla-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch TLA+ tools
        run: |
          curl -fsSL -o tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Check all models
        run: ./tla/check.sh

  lean-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan.sh
          sh elan.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: PscVerif
        run: lake exe cache get
      - name: Build and audit axioms
        working-directory: PscVerif
        run: |
          set -o pipefail
          lake build PscVerif 2>&1 | tee build.log
          if grep -q sorryAx build.log; then
            echo "sorryAx found in axiom audit"; exit 1
          fi
