name: PSC research checks

on:
  push:
  pull_request:

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Issue 45 source snapshots
        run: ./scripts/verify_all.sh provenance

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: pip install -e .[dev]
      - run: python scripts/check_vendored_sync.py
      - run: pytest

  mojo-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical Mojo regression tests
        working-directory: mojo
        run: pixi run test
      - name: Certificate checks
        working-directory: mojo
        run: pixi run verify
      - name: Alphabet-3 census regression
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Eq '^PIP specimens \(images of length <= 3\):[[:space:]]+4554$' <<<"$out"
          grep -Eq '^[[:space:]]*B_sigma construction terminated:[[:space:]]+4554[[:space:]]+capped:[[:space:]]+0$' <<<"$out"
          grep -Eq '^[[:space:]]*productive:[[:space:]]+4554[[:space:]]+non-productive:[[:space:]]+0$' <<<"$out"

  c3-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: C3 exact local census
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . c3_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Eq '^PIP specimens:[[:space:]]+4554[[:space:]]+capped:[[:space:]]+0$' <<<"$out"
          grep -Eq '^recurrent noncoincident SCCs:[[:space:]]+5022[[:space:]]+states:[[:space:]]+369486$' <<<"$out"
          grep -Eq '^SCCs with newborn synchronization:[[:space:]]+4962$' <<<"$out"
          grep -Eq '^SCCs without newborn synchronization:[[:space:]]+60$' <<<"$out"
          grep -Eq '^SCCs with inherited synchronization:[[:space:]]+4614$' <<<"$out"
          grep -Eq '^SCCs with both lineages synchronizing:[[:space:]]+4614$' <<<"$out"
          grep -Eq '^SCCs with neither lineage synchronizing:[[:space:]]+60$' <<<"$out"
          grep -Eq '^SCCs with clean-newborn state:[[:space:]]+1614$' <<<"$out"
          grep -Eq '^states with newborn synchronization:[[:space:]]+305730$' <<<"$out"
          grep -Eq '^states with inherited synchronization:[[:space:]]+171948$' <<<"$out"
          grep -Eq '^states with clean-newborn synchronization:[[:space:]]+141684$' <<<"$out"
          grep -Eq '^no-sync SCCs that are singleton:[[:space:]]+60$' <<<"$out"
          grep -Eq '^no-sync SCCs with direct coincidence sibling:[[:space:]]+0$' <<<"$out"
          grep -Eq '^no-sync SCCs with noncoincident exit:[[:space:]]+60$' <<<"$out"
          grep -Eq '^no-sync closed/no-direct-coincidence candidates:[[:space:]]+0$' <<<"$out"

  c4-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: C4 exact endpoint-type sink-SCC census
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . c4_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Fx 'PIP specimens: 4554  capped: 0' <<<"$out"
          grep -Fx 'degree4 unimodular PIP: 2628' <<<"$out"
          grep -Fx 'degree4 nonunimodular PIP: 1926' <<<"$out"
          grep -Fx 'degree4 unimodular three-real-root PIP: 648' <<<"$out"
          grep -Fx 'degree4 unimodular complex-pair PIP: 1980' <<<"$out"
          grep -Fx 'PIP cubics with zero discriminant: 0' <<<"$out"
          grep -Fx 'recurrent noncoincident SCCs: 5022' <<<"$out"
          grep -Fx 'noncoincident sink SCCs: 4554' <<<"$out"
          grep -Fx 'uncapped PIP with zero sink SCCs: 0' <<<"$out"
          grep -Fx 'uncapped PIP with exactly one sink SCC: 4554' <<<"$out"
          grep -Fx 'uncapped PIP with multiple sink SCCs: 0' <<<"$out"
          grep -Fx 'maximum sink SCCs per uncapped PIP: 1' <<<"$out"
          grep -Fx 'sink SCCs with direct coincidence child: 4554' <<<"$out"
          grep -Fx 'sink SCCs without direct coincidence child: 0' <<<"$out"
          grep -Fx 'sink SCCs with newborn synchronization: 4554' <<<"$out"
          grep -Fx 'sink SCCs with inherited synchronization: 4278' <<<"$out"
          grep -Fx 'sink SCCs with any boundary synchronization: 4554' <<<"$out"
          grep -Fx 'sink SCCs with no boundary synchronization: 0' <<<"$out"
          matrix='48,192,72,6,24,84,150,192,348,198,6,120,318,138,72,198,30,0,30,228,222,6,6,0,0,0,24,24,24,120,30,0,12,42,66,84,318,228,24,42,48,90,150,138,222,24,66,90,0'
          grep -Fx "PIP_TYPE_MATRIX $matrix" <<<"$out"
          grep -Fx "SINK_TYPE_MATRIX $matrix" <<<"$out"

  swap-discrepancy-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Exact swap-discrepancy census (G1b-1 cross-check)
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . swap_discrepancy_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Eq '^PIP specimens:[[:space:]]+4554[[:space:]]+capped:[[:space:]]+0$' <<<"$out"
          grep -Fx 'maximum reachable discrepancy: 14' <<<"$out"
          grep -Fx 'longest reachable state: 48020' <<<"$out"
          grep -Fx 'discrepancy histogram: 1:1554 2:1356 3:474 4:330 5:240 6:240 7:84 8:108 9:36 10:60 11:24 12:36 14:12' <<<"$out"

  swap-overlap-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Exact seed-patch overlap census (finite by theorem; productivity is evidence)
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . swap_overlap_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Fx 'PIP specimens: 4554' <<<"$out"
          grep -Fx 'overlap graphs built: 4554  capped: 0  failed: 0' <<<"$out"
          grep -Fx 'largest seed-patch overlap graph: 2640' <<<"$out"
          grep -Fx 'total seed-patch overlap states: 1118850' <<<"$out"
          grep -Fx 'nonproductive overlap specimens: 0  states: 0' <<<"$out"
          grep -Fx 'maximum first-coincidence depth: 18' <<<"$out"
          grep -Fx 'specimens by maximal first-coincidence depth: 3:402 4:828 5:696 6:648 7:444 8:396 9:276 10:300 11:168 12:84 13:36 14:24 15:108 16:84 17:36 18:24' <<<"$out"
          grep -Fx 'maximum first left-aligned depth: 17' <<<"$out"
          grep -Fx 'specimens by maximal first left-aligned depth: 2:300 3:996 4:870 5:594 6:312 7:300 8:414 9:288 10:132 11:60 12:36 13:48 14:84 15:72 16:36 17:12' <<<"$out"
          grep -Fx 'maximum prefix strong-coincidence depth: 15' <<<"$out"
          grep -Fx 'specimens by prefix strong-coincidence depth: 1:576 2:1416 3:654 4:858 5:666 6:252 7:102 8:18 14:6 15:6' <<<"$out"
          grep -Fx 'maximum suffix strong-coincidence depth: 15' <<<"$out"
          grep -Fx 'specimens by suffix strong-coincidence depth: 1:576 2:1416 3:654 4:858 5:666 6:252 7:102 8:18 14:6 15:6' <<<"$out"

  overlap-contracting-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Exact contracting-bound census (Proposition 5.42; finite evidence only)
        working-directory: mojo
        run: |
          set -o pipefail
          out=$(pixi run mojo run -I . overlap_contracting_census.mojo 2>&1)
          printf '%s\n' "$out"
          grep -Fx 'PIP specimens: 4554  failed: 0  nonproductive: 0' <<<"$out"
          grep -Fx 'vertices checked: 1118850' <<<"$out"
          grep -Fx 'maximum contracting lower bound m0: 8' <<<"$out"
          grep -Fx 'vertices by contracting lower bound m0: 0:34702 1:338684 2:429036 3:206232 4:77748 5:26496 6:5424 7:516 8:12' <<<"$out"
          grep -Fx 'maximum excess b - m0: 14' <<<"$out"
          grep -Fx 'vertices by excess b - m0: 0:116542 1:144998 2:199672 3:207832 4:174120 5:119662 6:77088 7:44568 8:21036 9:8988 10:2856 11:1008 12:360 13:96 14:24' <<<"$out"
          grep -Fx 'specimens by maximal excess: 1:378 2:990 3:912 4:612 5:390 6:516 7:330 8:120 9:96 10:60 11:78 12:42 13:24 14:6' <<<"$out"
          grep -Fx 'specimens by maximal m0: 1:1878 2:1602 3:738 4:210 5:72 6:30 7:18 8:6' <<<"$out"
          grep -Fx 'complex-pair specimens: 3906  maximal m0: 8  maximal excess: 14' <<<"$out"
          grep -Fx 'real-conjugate specimens: 648  maximal m0: 2  maximal excess: 4' <<<"$out"

  tla-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch TLA+ tools
        run: |
          curl -fsSL -o tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Check all models
        run: ./tla/check.sh

  lean-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan.sh
          sh elan.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: PscVerif
        run: lake exe cache get
      - name: Build and audit axioms
        working-directory: PscVerif
        run: |
          set -o pipefail
          lake build PscVerif 2>&1 | tee build.log
          if grep -q sorryAx build.log; then
            echo "sorryAx found in axiom audit"; exit 1
          fi
