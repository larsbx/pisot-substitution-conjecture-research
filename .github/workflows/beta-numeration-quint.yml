name: Beta numeration Quint

on:
  pull_request:
    paths:
      - '.github/workflows/beta-numeration-quint.yml'
      - 'docs/beta-*.md'
      - 'proof/quint/BetaNumeration.qnt'
      - 'tools/check_beta_numeration_quint.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-beta-numeration-controls:
    name: Independent exact golden-orbit and metallic-carry controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind the exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/beta-numeration-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the complete bounded inventory and reached assertions
        run: python3 tools/check_beta_numeration_quint.py --output "$RUNNER_TEMP/beta-numeration-quint"
      - name: Recheck revision and tracked sources
        run: |
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/beta-numeration-revision-after.txt"
          cmp "$RUNNER_TEMP/beta-numeration-revision.txt" "$RUNNER_TEMP/beta-numeration-revision-after.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-numeration-quint-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/beta-numeration-revision.txt
            ${{ runner.temp }}/beta-numeration-revision-after.txt
            ${{ runner.temp }}/beta-numeration-quint
          if-no-files-found: error
          retention-days: 30
