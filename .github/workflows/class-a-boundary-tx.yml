name: PSC class-A minus T/X/Y0 child stars

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_boundary_tx_children.mojo'
      - 'kernel/class_a_boundary_tx_children.mojo'
      - 'kernel/tests/test_class_a_boundary_tx_children.mojo'
      - 'oracles/python/class_a_boundary_tx_children.py'
      - 'tests/test_class_a_boundary_tx_children.py'
      - 'docs/class-a-boundary-tx-*.md'
      - 'evidence/class-a-boundary-tx-2026-10-28/**'
      - '.github/workflows/class-a-boundary-tx.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  six-oriented-stars:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact complete-star, endpoint and occurrence replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_tx_children.py
          python oracles/python/class_a_boundary_tx_children.py > /tmp/boundary-tx.json
          cmp /tmp/boundary-tx.json evidence/class-a-boundary-tx-2026-10-28/probe.json
          python tools/make_proof_bank.py --check
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical complete stars and selected typed exits
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_class_a_boundary_tx_children.mojo
          pixi run --locked mojo run -I . class_a_boundary_tx_children.mojo
