name: Class-D positive-b spine theorem

on:
  pull_request:
    paths:
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'kernel/psc/class_d_minus_spine_data.mojo'
      - 'kernel/psc/class_d_positive_b_spine.mojo'
      - 'kernel/class_d_positive_b_spine.mojo'
      - 'kernel/tests/test_class_d_positive_b_spine.mojo'
      - '.github/workflows/class-d-positive-b-spine-evidence.yml'
  workflow_dispatch:

concurrency:
  # A newer commit on the same branch or pull request supersedes this run's
  # queued and in-progress checks. Runs on main get a group of their own, so
  # every main commit keeps its receipts.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  spine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Verify exact two-parameter spine transport
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_class_d_positive_b_spine.mojo
          pixi run mojo run -I . class_d_positive_b_spine.mojo 2>&1 | tee positive-b-spine.log
          grep -F 'CLASS_D_MINUS_POSITIVE_B_SPINE_CERTIFIED rows= 145 targets= 6 direct= 129 alternate= 4 special= 6 max_rank= 4' positive-b-spine.log
