name: PSC class-A minus boundary H5 typed exits

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_boundary_h5_exit.mojo'
      - 'kernel/tests/test_class_a_boundary_h5_exit.mojo'
      - 'kernel/class_a_boundary_h5_exit.mojo'
      - 'oracles/python/class_a_boundary_h5_exit.py'
      - 'tests/test_class_a_boundary_h5_exit.py'
      - 'docs/class-a-boundary-h5-exit-2026-10-27.md'
      - '.github/workflows/class-a-boundary-h5-exit.yml'
  workflow_dispatch:

jobs:
  exact-H5-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent Fraction word-and-geometry witness oracle
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_h5_exit.py
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical H4 inherited proof and new H5 short-exit witness
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_class_a_boundary_h4_children.mojo
          pixi run --locked mojo run -I . tests/test_class_a_boundary_h5_exit.mojo
          pixi run --locked mojo run -I . class_a_boundary_h5_exit.mojo
