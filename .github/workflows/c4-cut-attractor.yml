name: C4 cut-attractor regression and census preservation

on:
  pull_request:
    paths:
      - '.github/workflows/c4-cut-attractor.yml'
      - 'kernel/psc/c4_cut_attractor.mojo'
      - 'kernel/tests/test_c4_cut_attractor.mojo'
      - 'tests/test_c4_cut_attractor_oracle.py'
      - 'kernel/psc/h1_census.mojo'
      - 'kernel/tests/test_h1_census.mojo'
      - 'oracles/python/h1_census_ap.py'
      - 'tests/test_h1_census_oracle.py'
      - 'kernel/pixi.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cut-attractor-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head checkout lease
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent word and cohomology oracles
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_cut_attractor_oracle.py tests/test_h1_census_oracle.py tests/test_c4_cut_pair_reduction_oracle.py
      - name: Generated sources and governance
        run: |
          python tools/make_proof_bank.py --check
          python tools/make_ledger.py --check
          python tools/make_math_catalogue.py --check
          python tools/vendoring/check_vendored_sync.py
          PYTHONPATH=tools python -m claim_governance.cli --root .
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical bookkeeping and unchanged census tables
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . -I tests tests/test_c4_cut_attractor.mojo
          pixi run --locked mojo run -I . -I tests tests/test_h1_census.mojo
          pixi run --locked mojo run -I . -I tests tests/test_c4_cut_pair_reduction.mojo
          pixi run --locked mojo run -I . -I tests tests/test_endpoint_core.mojo
