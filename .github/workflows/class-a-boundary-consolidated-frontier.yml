name: PSC class-A consolidated frontier audit

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_consolidated_frontier.py'
      - 'tests/test_class_a_boundary_consolidated_frontier.py'
      - 'docs/class-a-boundary-consolidated-frontier-2026-10-31.md'
      - '.github/workflows/class-a-boundary-consolidated-frontier.yml'
  workflow_dispatch:

jobs:
  frontier-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent finite witness audit and canonical source registry
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_consolidated_frontier.py
          python oracles/python/class_a_boundary_consolidated_frontier.py > /tmp/psc-class-a-frontier.json
