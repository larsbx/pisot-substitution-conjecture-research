name: PSC class-A CC four-occurrence star and typed exit

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_cc_children.py'
      - 'tests/test_class_a_boundary_cc_children.py'
      - 'docs/class-a-boundary-cc-carrier-2026-10-31.md'
      - '.github/workflows/class-a-boundary-cc.yml'
  workflow_dispatch:

jobs:
  cc-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact literal star and typed coincidence replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_cc_children.py
          python oracles/python/class_a_boundary_cc_children.py > /tmp/class-a-cc.json
