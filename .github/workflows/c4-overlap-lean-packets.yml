name: C4 concrete overlap Lean packets

on:
  pull_request:
    paths:
      - '.github/workflows/c4-overlap-lean-packets.yml'
      - 'proof/PscVerif/PscVerif.lean'
      - 'proof/PscVerif/ProofBankAudit.lean'
      - 'proof/PscVerif/PscVerif/OverlapPacket.lean'
      - 'proof/PscVerif/PscVerif/OverlapContraction.lean'
      - 'proof/PscVerif/lean-toolchain'
      - 'proof/PscVerif/lakefile.toml'
      - 'proof/PscVerif/lake-manifest.json'
      - 'tools/setup_lean.sh'
      - 'tools/check_lean.sh'
      - 'tools/make_proof_bank.py'
      - 'tools/replay_overlap_lean_packets.py'
      - 'tests/test_overlap_lean_packet_replay.py'
      - 'tests/fixtures/c4_overlap_bad_binding.lean'
      - 'kernel/c4_overlap_lean_export.mojo'
      - 'kernel/tests/test_c4_overlap_lean_export.mojo'
      - 'kernel/psc/c4_pair_overlap_attractor.mojo'
      - 'kernel/psc/c4_pair_overlap_graph.mojo'
      - 'kernel/psc/c4_finite_cylinder_overlap.mojo'
      - 'kernel/psc/c4_nonunit_residue_occupancy.mojo'
      - 'kernel/psc/c4_cylinder_density.mojo'
      - 'kernel/psc/derived_system.mojo'
      - 'kernel/psc/exact.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/finite_graph/scc.mojo'
      - 'kernel/mojo_smoke/claims.mojo'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'vendored.toml'
      - 'oracles/python/c4_pair_overlap_class.py'
      - 'oracles/python/c4_pair_overlap_graph.py'
      - 'evidence/c4-pair-overlap-class-2026-11-05/receipt.json'
  # PR events are suppressed while newer main conflicts with this fixed-baseline
  # verification draft. Run the same exact-head gate on its branch pushes.
  push:
    branches:
      - 'proof/c4-overlap-lean-2026-11-05'
    paths:
      - '.github/workflows/c4-overlap-lean-packets.yml'
      - 'proof/PscVerif/PscVerif.lean'
      - 'proof/PscVerif/ProofBankAudit.lean'
      - 'proof/PscVerif/PscVerif/OverlapPacket.lean'
      - 'proof/PscVerif/PscVerif/OverlapContraction.lean'
      - 'proof/PscVerif/lean-toolchain'
      - 'proof/PscVerif/lakefile.toml'
      - 'proof/PscVerif/lake-manifest.json'
      - 'tools/setup_lean.sh'
      - 'tools/check_lean.sh'
      - 'tools/make_proof_bank.py'
      - 'tools/replay_overlap_lean_packets.py'
      - 'tests/test_overlap_lean_packet_replay.py'
      - 'tests/fixtures/c4_overlap_bad_binding.lean'
      - 'kernel/c4_overlap_lean_export.mojo'
      - 'kernel/tests/test_c4_overlap_lean_export.mojo'
      - 'kernel/psc/c4_pair_overlap_attractor.mojo'
      - 'kernel/psc/c4_pair_overlap_graph.mojo'
      - 'kernel/psc/c4_finite_cylinder_overlap.mojo'
      - 'kernel/psc/c4_nonunit_residue_occupancy.mojo'
      - 'kernel/psc/c4_cylinder_density.mojo'
      - 'kernel/psc/derived_system.mojo'
      - 'kernel/psc/exact.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/finite_graph/scc.mojo'
      - 'kernel/mojo_smoke/claims.mojo'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'vendored.toml'
      - 'oracles/python/c4_pair_overlap_class.py'
      - 'oracles/python/c4_pair_overlap_graph.py'
      - 'evidence/c4-pair-overlap-class-2026-11-05/receipt.json'
  workflow_dispatch:

concurrency:
  group: c4-overlap-lean-packets-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlap-packet-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Provision the pinned Lean release and dependency sources
        run: |
          ./tools/setup_lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Test the audit protocol and compile the canonical Mojo exporter
        run: |
          python -m unittest discover -s tests -p test_overlap_lean_packet_replay.py -v
          cd kernel
          pixi run --locked mojo run -I . tests/test_c4_overlap_lean_export.mojo
          pixi run --locked mojo build -I . c4_overlap_lean_export.mojo -o /tmp/c4-overlap-lean-export
      - name: Compile from isolated sources and audit every local declaration
        shell: bash
        run: |
          set -o pipefail
          ./tools/check_lean.sh --overlap-packets /tmp/c4-overlap-lean-export /tmp/c4-overlap-lean-packets | tee /tmp/c4-overlap-lean-audit.log
      - name: Retain the exact-head audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4-overlap-lean-packets-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/c4-overlap-lean-audit.log
            /tmp/c4-overlap-lean-packets
          if-no-files-found: error
          retention-days: 30
