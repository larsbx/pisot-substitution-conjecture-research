name: PSC class-A three recovered uniform selected exits

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_three_exit_recovery.py'
      - 'tests/test_class_a_boundary_three_exit_recovery.py'
      - 'docs/class-a-boundary-three-exit-recovery-2026-10-31.md'
      - '.github/workflows/class-a-boundary-three-exit-recovery.yml'
  workflow_dispatch:

jobs:
  recover-three-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All-parameter affine certificate and independent literal-Fraction replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_three_exit_recovery.py
          python oracles/python/class_a_boundary_three_exit_recovery.py > /tmp/psc-three-exits.json
