name: C4 named forward-carrier native replay

on:
  pull_request:
    paths:
      - '.github/workflows/c4-forward-carrier.yml'
      - 'kernel/**'
      - 'oracles/python/check_forward_carrier.py'
      - 'tests/test_forward_carrier_evidence.py'
      - 'proof/PscVerif/PscVerif/NamedForwardCarrierData*.lean'
      - 'evidence/c4-forward-carrier-2026-11-12/**'
      - 'docs/c4-forward-carrier*.md'
      - 'pyproject.toml'
      - 'vendored.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-oracle:
    name: Locked native exports and independent literal replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODULAR_TELEMETRY_ENABLED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind the exact candidate revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the focused test dependency
        run: python -m pip install 'pytest>=7,<10'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Build and replay both carriers, refusals and independent controls
        env:
          PSC_FORWARD_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash kernel/check_forward_carrier.sh "$RUNNER_TEMP/forward-carrier"
      - name: Recheck tracked source cleanliness
        run: test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-forward-carrier-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/forward-carrier
          if-no-files-found: error
          retention-days: 30

# This gate certifies native replay and independent finite-carrier checks only.
# The existing Lean workflow separately checks formal source and axiom scope.
# Compact Lean source reproduction is checked byte-for-byte, but compilation
# and Lean/productivity acceptance remain separate obligations.
