name: Class-D assembly replay for a closure rebind

# Runs when the assembly sources change. The provenance gate of class-d-assembly.yml refuses an edit to
# an accepted source before it replays anything, so a rebind of the assembly
# (tools/check_class_d_closure_rebind.py, kind `assembly-replay`) needs a run
# of the same replay steps on the rebind head without that gate. The step
# names are the ones the rebind checker requires. This workflow certifies
# nothing on its own: its archived log is the receipt of a dated rebind packet.
on:
  pull_request:
    paths:
      - 'kernel/class_d_assembly.mojo'
      - 'kernel/psc/class_d_assembly.mojo'
      - 'kernel/tests/test_class_d_assembly.mojo'
      - '.github/workflows/class-d-assembly-replay.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assembly-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODULAR_TELEMETRY_ENABLED: 'false'
      MODULAR_CRASH_REPORTING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent calibration dependencies
        run: python -m pip install -e '.[dev]'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          manifest-path: kernel/pixi.toml
      - name: Record the replayed head
        run: git rev-parse HEAD
      - name: Replay the complete minus aggregate and seed controls
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo run -I . tests/test_class_d_minus_boundary_strips.mojo 2>&1 | tee ../assembly-minus.log
          pixi run --locked mojo run -I . tests/test_class_d_minus_seed_cover.mojo 2>&1 | tee ../assembly-seed.log
          pixi run --locked mojo run -I . tests/test_class_d_assembly.mojo 2>&1 | tee ../assembly-test.log
      - name: Independent rational calibration and receipt agreement
        run: |
          set -o pipefail
          python oracles/python/class_d_minus_boundary_strips.py --mojo-log assembly-minus.log | tee assembly-strips.json
          python oracles/python/class_d_minus_seed_cover.py --mojo-log assembly-seed.log | tee assembly-seed.json
          CLASS_D_MINUS_STRIPS_REPORT=assembly-strips.json CLASS_D_MINUS_COMPLETE_LOG=assembly-minus.log CLASS_D_SEED_COVER_REPORT=assembly-seed.json CLASS_D_SEED_COVER_MOJO_LOG=assembly-seed.log python -m pytest -q tests/test_class_d_minus_boundary_strips.py tests/test_class_d_minus_seed_cover.py tests/test_ledger_generation.py
      - name: Assemble immutable plus receipt with fresh minus and full plus boundary
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo run -I . class_d_assembly.mojo ../evidence/class-d-chamber-validation-2026-10-20/aggregate.log ../assembly-minus.log 2>&1 | tee ../assembly-native.log
          grep -Fx 'CLASS_D_ASSEMBLY_CANDIDATE plus_positive_b=complete minus_residual=complete plus_b0=complete inherited_wedges=ClassDWedgeBoundaryHitting target=offset_zero integration=pending universal_139=open' ../assembly-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-d-assembly-replay
          path: |
            assembly-*.log
            assembly-*.json
