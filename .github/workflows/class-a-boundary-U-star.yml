name: PSC class-A boundary U actual child star

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_boundary_U_star.mojo'
      - 'kernel/tests/test_class_a_boundary_U_star.mojo'
      - 'kernel/class_a_boundary_U_star.mojo'
      - 'oracles/python/class_a_boundary_U_star.py'
      - 'tests/test_class_a_boundary_U_star.py'
      - 'docs/class-a-boundary-U-star-2026-10-26.md'
      - '.github/workflows/class-a-boundary-U-star.yml'
  workflow_dispatch:

jobs:
  exact-boundary-U:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent rational full-Cartesian U oracle
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_U_star.py
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Native exact symbolic and literal child replay
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_class_a_boundary_U_star.mojo
          pixi run --locked mojo run -I . class_a_boundary_U_star.mojo
