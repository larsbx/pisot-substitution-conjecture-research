name: Class-A uniform gap theorem

on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'oracles/python/**'
      - 'tests/**'
      - 'docs/class-a-gap-*.md'
      - 'evidence/class-a-gap-*/**'
      - '.github/workflows/class-a-gap-theorem.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-gap-theorem:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=7'
      - name: Independent ray oracle and evidence integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel/build/class-a-gap-audit
          python -m pytest tests/test_class_a_residue_rays.py tests/test_class_a_d2_plus_ray_carrier.py tests/test_recorded_data_integrity.py 2>&1 | tee kernel/build/class-a-gap-audit/python.log
          python oracles/python/class_a_gap_regime_adversarial.py 2>&1 | tee kernel/build/class-a-gap-audit/stress-rays.log
          (cd evidence/class-a-gap-theorem-2026-10-23 && sha256sum -c SHA256SUMS)
      - name: Install Pixi
        shell: bash
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Locked native arithmetic, closure, occurrence, coverage and assembly checks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          for name in gap_form poly_hu class_a_gap_uniform class_a_gap_regime_descent class_a_gap_theorem class_a_residue_rays overlap_zipper; do
            pixi run --locked mojo run -I . "tests/test_${name}.mojo" 2>&1 | tee "build/class-a-gap-audit/${name}.log"
          done
      - name: Preserve acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-a-gap-audit-receipts
          path: kernel/build/class-a-gap-audit/
          if-no-files-found: warn
