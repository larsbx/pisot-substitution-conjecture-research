name: Total-length separation evidence
on:
  pull_request:
    paths:
      - 'mojo/psc/separation_sweep.mojo'
      - 'mojo/separation_radius_total_length_sweep.mojo'
      - 'mojo/tests/test_separation_sweep.mojo'
      - '.github/workflows/separation-radius-sweep.yml'
  workflow_dispatch:
jobs:
  separation-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical regressions and claim receipts
        working-directory: mojo
        run: pixi run test
      - name: Claim governance
        run: PYTHONPATH=tools python3 -m claim_governance.cli --root .
      - name: Exhaustive deterministic separation survey
        working-directory: mojo
        run: |
          set -o pipefail
          pixi run separation-radius-total-length-sweep 2>&1 | tee separation-radius.log
          grep -Fx 'COMPLETE separation sweep: 24486 classified; 0 inconclusive' separation-radius.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: total-length-separation-evidence
          path: |
            mojo/separation-radius.log
            mojo/build/claim-receipts.tsv
