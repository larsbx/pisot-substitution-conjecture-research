name: PSC class-A boundary U children

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_boundary_u_children.mojo'
      - 'kernel/class_a_boundary_u_children.mojo'
      - 'kernel/tests/test_class_a_boundary_u_children.mojo'
      - 'oracles/python/class_a_boundary_u_children.py'
      - 'tests/test_class_a_boundary_u_children.py'
      - 'docs/class-a-boundary-u-carrier-2026-10-26.md'
      - 'evidence/class-a-boundary-u-2026-10-26/**'
      - '.github/workflows/class-a-boundary-u.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-u-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact oracle and generated proof bank
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_u_children.py
          python oracles/python/class_a_boundary_u_children.py > /tmp/boundary-u.json
          cmp /tmp/boundary-u.json evidence/class-a-boundary-u-2026-10-26/probe.json
          python tools/make_proof_bank.py --check
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical U cone certificate and actual target packets
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_class_a_boundary_u_children.mojo
          pixi run --locked mojo run -I . class_a_boundary_u_children.mojo
