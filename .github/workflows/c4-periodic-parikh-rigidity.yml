name: C4 periodic Parikh phase rigidity

on:
  pull_request:
    paths:
      - '.github/workflows/c4-periodic-parikh-rigidity.yml'
      - 'docs/c4-periodic-parikh-phase-rigidity-2026-11-04.md'
      - 'docs/side-notes-ledger.md'
      - 'docs/proof-bank.md'
      - 'proof/proof-bank.json'
      - 'kernel/psc/c4_periodic_parikh_phase.mojo'
      - 'kernel/tests/test_c4_periodic_parikh_rigidity.mojo'
      - 'tests/test_c4_periodic_parikh_rigidity_oracle.py'
      - 'kernel/pixi.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-periodic-phase-rigidity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact cubic and cyclic-class oracle
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_periodic_parikh_rigidity_oracle.py
      - name: Check generated source statement inventory
        run: python tools/make_proof_bank.py --check
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical exact bounded Mojo periodic-class rank audit
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_periodic_parikh_rigidity.mojo
