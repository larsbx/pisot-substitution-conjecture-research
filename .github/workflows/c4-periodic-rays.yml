name: C4 periodic-ray decision

on:
  pull_request:
    paths:
      - '.github/workflows/c4-periodic-rays.yml'
      - 'docs/c4-periodic-ray-decision*.md'
      - 'docs/c4-phase-aligned-ray*.md'
      - 'docs/c4-strict-component-period-*.md'
      - 'docs/c4-bilateral-newborn-family-*.md'
      - 'docs/c4-determinant-three-carrier-*.md'
      - 'docs/c4-phase-one-newborn-stop-go-*.md'
      - 'docs/c4-strict-period-stop-go-*.md'
      - 'kernel/psc/c4_periodic_rays.mojo'
      - 'kernel/psc/overlap_seed_patch.mojo'
      - 'kernel/psc/perron_field3.mojo'
      - 'kernel/psc/c4_addressed_newborn.mojo'
      - 'kernel/psc/c4_affine_carrier.mojo'
      - 'kernel/psc/ordered_occurrence_graph.mojo'
      - 'kernel/tests/test_c4_determinant_three_carrier.mojo'
      - 'kernel/tests/test_c4_periodic_rays.mojo'
      - 'kernel/tests/test_c4_strict_period.mojo'
      - 'kernel/tests/test_c4_phase_one_seams.mojo'
      - 'kernel/tests/test_c4_overlap_enclosure.mojo'
      - 'kernel/psc/c4_legal_seams.mojo'
      - 'kernel/psc/c4_cut_alignment.mojo'
      - 'kernel/psc/derived_system.mojo'
      - 'kernel/psc/hub_selector.mojo'
      - 'kernel/finite_graph/signing.mojo'
      - 'kernel/pixi.lock'
      - 'reference/psc_research/overlap_graph.py'
      - 'reference/psc_research/pip_screen.py'
      - 'tests/test_c4_periodic_rays_oracle.py'
      - 'tests/test_c4_strict_period_oracle.py'
      - 'tests/test_c4_phase_one_seams_oracle.py'
      - 'tests/test_c4_determinant_three_carrier_oracle.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  MODULAR_TELEMETRY_ENABLED: 'false'
  MODULAR_CRASH_REPORTING_ENABLED: 'false'

jobs:
  periodic-ray-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Replay canonical Mojo graphs and addressed newborn
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo run -I . tests/test_c4_periodic_rays.mojo | tee "$RUNNER_TEMP/c4-periodic-rays.txt"
      - name: Replay strict-component periods and the common enclosed factor
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_strict_period.mojo
      - name: Replay bilateral seam filters with phase-zero regressions
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_c4_phase_one_seams.mojo
          pixi run --locked mojo run -I . tests/test_c4_overlap_enclosure.mojo
      - name: Prove the determinant-three symbolic carrier and replay the boundary
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run --locked mojo run -I . tests/test_c4_determinant_three_carrier.mojo | tee "$RUNNER_TEMP/c4-det3.txt"
      - name: Match the independent exact graphs and literal addresses
        run: |
          python -m pip install 'pytest>=7,<10'
          PSC_PERIODIC_RAY_NATIVE="$RUNNER_TEMP/c4-periodic-rays.txt" PSC_DET3_NATIVE="$RUNNER_TEMP/c4-det3.txt" python -m pytest tests/test_c4_periodic_rays_oracle.py tests/test_c4_strict_period_oracle.py tests/test_c4_phase_one_seams_oracle.py tests/test_c4_overlap_enclosure_oracle.py tests/test_c4_determinant_three_carrier_oracle.py
      - name: Check generated proof inventory
        run: python tools/make_proof_bank.py --check
