name: Class-B top-layer ray certificate

on:
  pull_request:
    paths:
      - 'kernel/psc/class_b_ray_line.mojo'
      - 'kernel/psc/class_b_ray_certificate.mojo'
      - 'kernel/psc/class_b_ray_tables.mojo'
      - 'kernel/psc/class_a_carrier_closure.mojo'
      - 'kernel/class_b_ray_certificate.mojo'
      - 'kernel/class_b_top_layer_profile.mojo'
      - 'kernel/tests/test_class_b_ray_certificate.mojo'
      - 'oracles/python/class_b_ray_certificate.py'
      - 'oracles/python/class_b_ray_tables.py'
      - 'tests/test_class_b_ray_certificate.py'
      - 'evidence/class-b-label-rays-2026-10-23/carriers.json'
      - 'evidence/class-b-ray-certificate-2026-10-27/**'
      - 'docs/class-b-ray-certificate-2026-10-27.md'
      - '.github/workflows/class-b-ray-certificate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  exact-class-b-rays:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=7'
      - name: Independent verifier, generated tables and refusals
        run: |
          set -euo pipefail
          mkdir -p kernel/build/class-b-rays
          python -m pytest -q tests/test_class_b_ray_certificate.py
          python oracles/python/class_b_ray_certificate.py > kernel/build/class-b-rays/oracle.log
          (cd evidence/class-b-ray-certificate-2026-10-27 && sha256sum -c SHA256SUMS)
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical certificate, finite replays and graphs below every floor
        working-directory: kernel
        run: |
          set -euo pipefail
          pixi run --locked mojo run -I . -I tests tests/test_class_b_ray_certificate.mojo > build/class-b-rays/native-test.log
          pixi run --locked mojo build -I . class_b_ray_certificate.mojo -o build/class-b-ray-certificate
          build/class-b-ray-certificate all > build/class-b-rays/all.log
          grep -q '^CLASS_B_RAY_CERTIFICATES_COMPLETE rays 83$' build/class-b-rays/all.log
      - name: Native and independent counts agree on every ray
        run: |
          set -euo pipefail
          cd kernel/build/class-b-rays
          grep '^CLASS_B_RAY_CERTIFICATE ' all.log | sed 's/^CLASS_B_RAY_CERTIFICATE //; s/ max_b [0-9]*$//' > native.counts
          sed 's/^CLASS_B_RAY_ORACLE //' oracle.log > oracle.counts
          test "$(wc -l < native.counts)" -eq 21
          diff native.counts oracle.counts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-b-rays
          path: kernel/build/class-b-rays/
