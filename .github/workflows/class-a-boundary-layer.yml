name: PSC class-A boundary-layer exact probe

on:
  pull_request:
    paths:
      - 'docs/class-a-boundary-layer-2026-10-26.md'
      - 'kernel/psc/class_a_boundary_layer.mojo'
      - 'kernel/class_a_boundary_layer.mojo'
      - 'kernel/tests/test_class_a_boundary_layer.mojo'
      - 'oracles/python/class_a_boundary_probe.py'
      - 'tests/test_class_a_boundary_layer.py'
      - 'evidence/class-a-boundary-layer-2026-10-26/**'
      - '.github/workflows/class-a-boundary-layer.yml'
  workflow_dispatch:

jobs:
  exact-boundary-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=7'
      - name: Replay exact finite oracle and archived output
        run: python -m pytest -q tests/test_class_a_boundary_layer.py
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Run locked canonical symbolic certificates and regression
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_class_a_boundary_layer.mojo
          pixi run --locked mojo run -I . class_a_boundary_layer.mojo
