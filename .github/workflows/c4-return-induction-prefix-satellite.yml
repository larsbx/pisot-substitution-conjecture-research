name: C4 return induction and prefix-satellite obstruction

on:
  pull_request:
    paths:
      - '.github/workflows/c4-return-induction-prefix-satellite.yml'
      - 'docs/c4-return-induction-prefix-satellite-counterexample-2026-11-04.md'
      - 'kernel/psc/c4_return_induction_prefix_satellite.mojo'
      - 'kernel/tests/test_c4_return_induction_prefix_satellite.mojo'
      - 'tests/test_c4_return_induction_prefix_satellite_oracle.py'
      - 'kernel/pixi.lock'
      - 'proof/proof-bank.json'
      - 'docs/proof-bank.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-return-induction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently derive return words, induced substitution and prefix-code controls
        run: |
          python -m pip install 'pytest>=7,<10'
          python -m pytest -q tests/test_c4_return_induction_prefix_satellite_oracle.py
      - name: Check generated source theorem inventory
        run: python tools/make_proof_bank.py --check
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical Mojo ordered return factorization and source Pisot control
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_return_induction_prefix_satellite.mojo
