name: C4 recurrent flat exits

on:
  pull_request:
    paths:
      - '.github/workflows/c4-recurrent-flat-exits.yml'
      - 'docs/c4-recurrent-flat-exits-2026-11-04.md'
      - 'docs/c4-forced-overlap-routes-2026-11-04.md'
      - 'docs/c4-orientation-safe-transfer-2026-11-09.md'
      - 'evidence/c4-orientation-safe/**'
      - 'kernel/psc/c4_*.mojo'
      - 'kernel/psc/target_packets.mojo'
      - 'kernel/tests/test_c4_*.mojo'
      - 'kernel/tests/test_target_packets.mojo'
      - 'kernel/pixi.lock'
      - 'tests/test_c4_*_oracle.py'
      - 'proof/PscVerif/PscVerif/Occurrence*.lean'
      - 'proof/PscVerif/PscVerif/DescendantSpan*.lean'
      - 'proof/quint/C4OccurrenceBridge.qnt'
      - 'proof/quint/C4OverlapMass.qnt'
      - 'tools/check_c4_occurrence_quint.py'
      - 'tools/check_c4_overlap_mass_quint.py'
      - 'docs/c4-concrete-occurrence-*.md'
      - 'docs/c4-address-transport-*.md'
      - 'docs/c4-occurrence-transport-*.md'
      - 'docs/c4-occurrence-addresses-*.md'
      - 'docs/c4-finite-carrier-*.md'
      - 'docs/c4-finite-occurrence-*.md'
      - 'docs/c4-descendant-span-*.md'
      - 'docs/c4-interior-successors-*.md'
      - 'docs/c4-overlap-mass-*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent Python oracle and both controls
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_c4_overlap_enclosure_oracle.py tests/test_c4_addressed_newborn_oracle.py tests/test_c4_recurrent_flat_exits_oracle.py \
            tests/test_c4_complete_cone_hub_audit_oracle.py tests/test_c4_two_generation_rank_oracle.py \
            tests/test_c4_forced_overlap_routes_oracle.py tests/test_c4_orientation_safe_oracle.py
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical Mojo replay and both controls
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_c4_overlap_enclosure.mojo
          pixi run --locked mojo run -I . tests/test_c4_addressed_newborn.mojo
          pixi run --locked mojo run -I . tests/test_target_packets.mojo
          pixi run --locked mojo run -I . tests/test_c4_recurrent_flat_exits.mojo
          pixi run --locked mojo run -I . tests/test_c4_complete_cone_hub_audit.mojo
          pixi run --locked mojo run -I . tests/test_c4_two_generation_rank.mojo
          pixi run --locked mojo run -I . tests/test_c4_finite_carrier.mojo
          pixi run --locked mojo run -I . tests/test_c4_overlap_mass.mojo
          pixi run --locked mojo run -I . tests/test_c4_forced_overlap_routes.mojo

  orientation-safe-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Provision the pinned Lean release
        run: |
          ./tools/setup_lean.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the standalone occurrence-path reduction
        working-directory: proof/PscVerif
        run: lean ../../evidence/c4-orientation-safe/OrientationSafe.lean

  occurrence-bridge-quint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/c4-occurrence-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check literal word contracts and deliberately weakened controls
        run: |
          python3 tools/check_c4_occurrence_quint.py \
            --output "$RUNNER_TEMP/c4-occurrence-quint"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-occurrence-quint-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/c4-occurrence-revision.txt
            ${{ runner.temp }}/c4-occurrence-quint
          if-no-files-found: error
          retention-days: 30

  overlap-mass-quint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/c4-overlap-mass-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ordered overlap mass and adversarial count controls
        run: |
          python3 tools/check_c4_overlap_mass_quint.py \
            --output "$RUNNER_TEMP/c4-overlap-mass-quint"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-overlap-mass-quint-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/c4-overlap-mass-revision.txt
            ${{ runner.temp }}/c4-overlap-mass-quint
          if-no-files-found: error
          retention-days: 30
