name: C4 named stable chart

on:
  pull_request:
    paths:
      - '.github/workflows/c4-named-stable-chart.yml'
      - 'docs/c4-named-stable-chart*.md'
      - 'proof/PscVerif/**'
      - 'proof/quint/C4NamedStableChart.qnt'
      - 'tools/check_c4_named_stable_chart_quint.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-chart-controls:
    name: Independent exact matrix-norm and chart controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind the exact revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/named-chart-revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the complete bounded inventory and reached assertions
        run: python3 tools/check_c4_named_stable_chart_quint.py --output "$RUNNER_TEMP/named-chart-quint"
      - name: Recheck revision and tracked sources
        run: |
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/named-chart-revision-after.txt"
          cmp "$RUNNER_TEMP/named-chart-revision.txt" "$RUNNER_TEMP/named-chart-revision-after.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-named-stable-chart-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/named-chart-revision.txt
            ${{ runner.temp }}/named-chart-revision-after.txt
            ${{ runner.temp }}/named-chart-quint
          if-no-files-found: error
          retention-days: 30
