name: PSC class-A Y0 every-first-choice typed exits

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_boundary_y0_every_child.py'
      - 'oracles/python/class_a_boundary_y0_symbolic_transport.py'
      - 'tests/test_class_a_boundary_y0_every_child.py'
      - 'docs/class-a-boundary-y0-every-child-2026-10-31.md'
      - '.github/workflows/class-a-boundary-y0-every-child.yml'
  workflow_dispatch:

jobs:
  y0-all-first-choices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact symbolic and independent literal/Fraction replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_y0_every_child.py
          python oracles/python/class_a_boundary_y0_symbolic_transport.py > /tmp/y0-symbolic.json
          python oracles/python/class_a_boundary_y0_every_child.py > /tmp/y0-literal.json
