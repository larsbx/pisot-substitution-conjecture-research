name: PSC class-A X to eight swapped-patch seeds

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_x_to_eight_swap_seeds.py'
      - 'tests/test_class_a_x_to_eight_swap_seeds.py'
      - 'docs/class-a-x-to-eight-swap-seeds-2026-10-31.md'
      - '.github/workflows/class-a-x-to-eight-swap-seeds.yml'
  workflow_dispatch:

jobs:
  eight-seed-strong-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Universal exact affine/strictness and literal-Fraction replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_x_to_eight_swap_seeds.py
          python oracles/python/class_a_x_to_eight_swap_seeds.py > /tmp/x-to-eight.json
