name: PSC R1 bounded source witness
on:
  pull_request:
    paths:
      - '.github/workflows/psc-r1-rank-witness.yml'
      - 'proof/psc_routes/R1RankWitness.lean'
      - 'proof/psc_routes/R1SupportCertificate.lean'
      - 'proof/psc_routes/R1SupportFixtures.lean'
      - 'proof/psc_routes/R1ProductivityScope.lean'
      - 'proof/quint/PscR1RankWitness.qnt'
      - 'proof/quint/PscR1SupportCertificate.qnt'
      - 'docs/psc-r1-rank-witness-2026-11-08.md'
      - 'tools/setup_lean.sh'
      - 'proof/PscVerif/lean-toolchain'
      - 'proof/PscVerif/lakefile.toml'
      - 'proof/PscVerif/lake-manifest.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-rank-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lean-bounded-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind all dependencies to exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/rank-witness"
          git rev-parse HEAD > "$RUNNER_TEMP/rank-witness/head.txt"
          sha256sum proof/psc_routes/R1RankWitness.lean proof/psc_routes/R1SupportCertificate.lean proof/psc_routes/R1SupportFixtures.lean proof/psc_routes/R1ProductivityScope.lean > "$RUNNER_TEMP/rank-witness/source.sha256"
      - name: Verify the complete new theorem inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('proof/psc_routes/R1RankWitness.lean').read_text()
          declared=['PscRoutes.R1RankWitness.'+x for x in re.findall(r'(?m)^(?:theorem|lemma)\s+(\w+)',s)]
          audit=s.split('let names := #[',1)[1].split(']',1)[0]
          names=re.findall(r'`(PscRoutes\.[A-Za-z_0-9.]+)',audit)
          if declared != names or len(names)!=7 or len(set(names))!=7:
              raise SystemExit(f'incomplete rank-witness inventory: {declared!r} vs {names!r}')
          if re.search(r'(?m)^\s*(?:private\s+)?axiom\b',s):
              raise SystemExit('local axiom is not an accepted proof')
          print('RANK_WITNESS_INVENTORY_OK',len(names))
          PY
      - name: Provision pinned Lean and Mathlib without changing pins
        run: ./tools/setup_lean.sh
      - name: Compile all source dependencies and the quantitative theorem
        working-directory: proof/PscVerif
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rank-witness"
          routes="$GITHUB_WORKSPACE/proof/psc_routes"
          lake="$HOME/.elan/bin/lake"
          for module in R1ProductivityScope R1SupportCertificate R1SupportFixtures R1RankWitness; do
            "$lake" env bash -c 'export LEAN_PATH="$1:${LEAN_PATH:-}"; exec lean --root="$2" -o "$1/$3.olean" "$2/$3.lean"' _ "$out" "$routes" "$module" | tee "$out/$module.log"
          done
          ! grep -Eq 'sorryAx|error:' "$out"/*.log
          test "$(grep -c '^PSC_PRODUCTIVITY_SCOPE_AXIOMS_OK' "$out/R1ProductivityScope.log")" -eq 15
          test "$(grep -c '^PSC_SUPPORT_AXIOMS_OK' "$out/R1SupportCertificate.log")" -eq 12
          test "$(grep -c '^PSC_SUPPORT_FIXTURE_AXIOMS_OK' "$out/R1SupportFixtures.log")" -eq 13
          test "$(grep -c '^PSC_RANK_WITNESS_AXIOMS_OK' "$out/R1RankWitness.log")" -eq 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-rank-lean-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rank-witness/*.log
            ${{ runner.temp }}/rank-witness/*.sha256
            ${{ runner.temp }}/rank-witness/head.txt
          if-no-files-found: error
  quint-bounded-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind witness and imported source checker to exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          mkdir -p "$RUNNER_TEMP/rank-witness"
          git rev-parse HEAD > "$RUNNER_TEMP/rank-witness/head.txt"
          sha256sum proof/quint/PscR1RankWitness.qnt proof/quint/PscR1SupportCertificate.qnt > "$RUNNER_TEMP/rank-witness/quint.sha256"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck and execute every bounded-witness test
        shell: bash
        run: |
          set -euo pipefail
          q=proof/quint/PscR1RankWitness.qnt
          npx --yes @informalsystems/quint@0.33.1 typecheck "$q"
          npx --yes @informalsystems/quint@0.33.1 test --backend=typescript "$q" --main=PscR1RankWitness --match='Test$' | tee "$RUNNER_TEMP/rank-witness/quint.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=Path('proof/quint/PscR1RankWitness.qnt').read_text()
          names=re.findall(r'(?m)^\s*run\s+(\w+Test)\b',s)
          log=(Path(os.environ['RUNNER_TEMP'])/'rank-witness/quint.log').read_text()
          if len(names)!=9 or len(set(names))!=9 or not re.search(r'\b9 (?:passing|passed)\b',log):
              raise SystemExit('expected nine distinct executed tests')
          for name in names:
              if not any(name in line and 'passed' in line for line in log.splitlines()):
                  raise SystemExit(f'missing passed named test {name}')
          print('ALL_NINE_BOUNDED_WITNESS_TESTS_EXECUTED')
          PY
      - name: Prepare independent strict-decrease and endpoint mutations
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'rank-witness'
          base=Path('proof/quint/PscR1SupportCertificate.qnt').read_text()
          witness=Path('proof/quint/PscR1RankWitness.qnt').read_text()
          a='rows[s].indices().exists(j => rank[rows[s][j]] < rank[s])'
          b='target(pairs[path[path.length() - 1]])'
          assert base.count(a)==1 and witness.count(b)==1
          for name in ['weak_rank','false_endpoint']:
              out=root/name
              out.mkdir()
              (out/'PscR1SupportCertificate.qnt').write_text(base.replace(a,a.replace(' < ',' <= ')) if name=='weak_rank' else base)
              (out/'PscR1RankWitness.qnt').write_text(witness.replace(b,'true') if name=='false_endpoint' else witness)
          PY
      - name: Require named semantic failure from both typechecked mutants
        shell: bash
        run: |
          set -euo pipefail
          for pair in 'weak_rank equalityIsNotRankProgressTest' 'false_endpoint nontargetEndpointRejectedTest'; do
            read -r mutant testname <<< "$pair"
            q="$RUNNER_TEMP/rank-witness/$mutant/PscR1RankWitness.qnt"
            log="$RUNNER_TEMP/rank-witness/$mutant.log"
            npx --yes @informalsystems/quint@0.33.1 typecheck "$q"
            if npx --yes @informalsystems/quint@0.33.1 test --backend=typescript "$q" --main=PscR1RankWitness --match="^${testname}$" > "$log" 2>&1; then
              cat "$log"
              echo "INVALID_WITNESS_MUTANT_ACCEPTED: $mutant" >&2
              exit 1
            fi
            cat "$log"
            grep -F "$testname" "$log" | grep -Ei 'fail' >/dev/null
            echo "EXPECTED_WITNESS_MUTATION_REJECTION $mutant"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-rank-quint-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rank-witness/*.log
            ${{ runner.temp }}/rank-witness/*.sha256
            ${{ runner.temp }}/rank-witness/head.txt
          if-no-files-found: error
