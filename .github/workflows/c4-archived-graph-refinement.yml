name: Archived C4 graph source refinement

on:
  pull_request:
    paths:
      - '.github/workflows/c4-archived-graph-refinement.yml'
      - 'kernel/psc/c4_archived_graph_refinement.mojo'
      - 'kernel/c4_archived_graph_refinement.mojo'
      - 'kernel/tests/test_c4_archived_graph_refinement.mojo'
      - 'oracles/python/c4_archived_graph_refinement.py'
      - 'tests/test_c4_archived_graph_refinement_oracle.py'
      - 'kernel/psc/c4_pair_overlap_graph.mojo'
      - 'kernel/psc/c4_literal_inverse_binding.mojo'
      - 'kernel/psc/c4_finite_cylinder_overlap.mojo'
      - 'kernel/psc/c4_nonunit_residue_occupancy.mojo'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'oracles/python/c4_pair_overlap_graph.py'
      - 'proof/PscVerif/**'
      - 'evidence/c4-pair-overlap-graph-2026-11-05/**'
      - 'evidence/c4-archived-graph-refinement-2026-11-11/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archived-c4-refinement-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-oracle:
    name: Complete original graphs and independent addressed replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact candidate revision and original archive
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/archived-c4-refinement"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/archived-c4-refinement/revision.txt"
          sha256sum evidence/c4-pair-overlap-graph-2026-11-05/receipt.json > "$RUNNER_TEMP/archived-c4-refinement/archive-sha256.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=7,<10'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical complete source, positional, ancestry and rejection checks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          pixi run --locked mojo run -I . tests/test_c4_archived_graph_refinement.mojo | tee "$RUNNER_TEMP/archived-c4-refinement/native-tests.log"
          pixi run --locked mojo run -I . c4_archived_graph_refinement.mojo > "$RUNNER_TEMP/archived-c4-refinement/native-packet.txt"
      - name: Independent rational inverse and full packet parity
        shell: bash
        env:
          PSC_ARCHIVED_GRAPH_REFINEMENT_NATIVE_OUTPUT: ${{ runner.temp }}/archived-c4-refinement/native-packet.txt
        run: |
          set -euo pipefail
          test -s "$PSC_ARCHIVED_GRAPH_REFINEMENT_NATIVE_OUTPUT"
          python -m pytest --assert=plain -q tests/test_c4_archived_graph_refinement_oracle.py | tee "$RUNNER_TEMP/archived-c4-refinement/oracle-tests.log"
          python oracles/python/c4_archived_graph_refinement.py --native "$PSC_ARCHIVED_GRAPH_REFINEMENT_NATIVE_OUTPUT" --controls > "$RUNNER_TEMP/archived-c4-refinement/receipt.json"
          python tools/make_proof_bank.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-c4-refinement-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/archived-c4-refinement
          if-no-files-found: error
          retention-days: 30
