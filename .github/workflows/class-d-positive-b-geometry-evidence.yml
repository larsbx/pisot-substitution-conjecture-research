name: Class-D positive-b geometry repair

on:
  pull_request:
    paths:
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'kernel/psc/symbolic_line.mojo'
      - 'kernel/psc/class_d_positive_b_spine.mojo'
      - 'kernel/psc/class_d_positive_b_geometry.mojo'
      - 'kernel/class_d_positive_b_geometry.mojo'
      - 'kernel/tests/test_symbolic_line_empty_blocks.mojo'
      - 'kernel/tests/test_class_d_positive_b_obstructions.mojo'
      - 'kernel/tests/test_class_d_positive_b_spine.mojo'
      - 'kernel/tests/test_class_d_positive_b_geometry.mojo'
      - 'kernel/tests/test_symbolic_line.mojo'
      - 'docs/p1b-class-d-positive-b-wedge-2026-10-19.md'
      - '.github/workflows/class-d-positive-b-geometry-evidence.yml'
  workflow_dispatch:

concurrency:
  # A newer commit on the same branch or pull request supersedes this run's
  # queued and in-progress checks. Runs on main get a group of their own, so
  # every main commit keeps its receipts.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Verify repaired run blocks and conditional geometry
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . tests/test_symbolic_line_empty_blocks.mojo
          pixi run mojo run -I . tests/test_class_d_positive_b_obstructions.mojo
          pixi run mojo run -I . tests/test_class_d_positive_b_spine.mojo
          pixi run mojo run -I . tests/test_class_d_positive_b_geometry.mojo
          pixi run mojo run -I . class_d_positive_b_geometry.mojo 2>&1 | tee positive-b-geometry.log
          grep -F 'CLASS_D_MINUS_POSITIVE_B_GEOMETRY_CERTIFIED' positive-b-geometry.log
      - name: Preserve all existing symbolic-line verdicts
        working-directory: kernel
        run: pixi run mojo run -I . tests/test_symbolic_line.mojo
