name: PSC B-prime R3 Lean + Quint gate
on:
  pull_request:
    paths:
      - '.github/workflows/psc-bprime-r3.yml'
      - 'proof/psc_routes/R3.lean'
      - 'proof/quint/PscR3.qnt'
      - 'docs/psc-bprime-route-r3-2026-11-07.md'
      - 'tools/setup_lean.sh'
      - 'tools/make_proof_bank.py'
      - 'proof/proof-bank.toml'
      - 'proof/PscVerif/lean-toolchain'
      - 'proof/PscVerif/lakefile.toml'
      - 'proof/PscVerif/lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact commit
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Provision repository-pinned Lean and Mathlib
        run: ./tools/setup_lean.sh
      - name: Compile scoped Lean lemmas and print their axiom dependencies
        working-directory: proof/PscVerif
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lake" env lean ../../proof/psc_routes/R3.lean | tee "$RUNNER_TEMP/r3-lean.log"
          if grep -Eq 'sorryAx|^error:|error:' "$RUNNER_TEMP/r3-lean.log"; then
            echo "Unaccepted Lean error or sorry axiom" >&2
            exit 1
          fi
          for theorem in bounded_block_coordinate shift_factor_identity \
            telescoping_prefix_increments sliding_factor_sum_identity \
            vector_sliding_factor_sum_identity finite_bounded_pair_states \
            finite_bounded_balanced_states; do
            grep -Fx $'PSC_ROUTE_AXIOMS_OK\t'"PscRoutes.R3.$theorem" \
              "$RUNNER_TEMP/r3-lean.log" >/dev/null
          done
          test "$(grep -c '^PSC_ROUTE_AXIOMS_OK' "$RUNNER_TEMP/r3-lean.log")" -eq 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psc-r3-lean-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r3-lean.log
          if-no-files-found: error
          retention-days: 30

  quint-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact commit
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck bounded adversarial model
        run: npx --yes @informalsystems/quint@0.33.1 typecheck proof/quint/PscR3.qnt
      - name: Replay bounded invariants (not universal model proof)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @informalsystems/quint@0.33.1 run proof/quint/PscR3.qnt --invariant=withinBound --seed=20261111
      - name: Run deterministic Quint negative witness (not stochastic sampling)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @informalsystems/quint@0.33.1 test proof/quint/PscR3.qnt --seed=20261111 | tee "$RUNNER_TEMP/r3-quint.log"
          grep -E '^[[:space:]]*1 (passing|passed)([[:space:]]|$)' "$RUNNER_TEMP/r3-quint.log" >/dev/null
