name: PSC class-A orientation-complete swapped-patch closure

on:
  pull_request:
    paths:
      - 'oracles/python/class_a_oriented_swap_closure.py'
      - 'tests/test_class_a_oriented_swap_closure.py'
      - 'docs/class-a-oriented-swap-closure-2026-10-31.md'
      - '.github/workflows/class-a-oriented-swap-closure.yml'
  workflow_dispatch:

jobs:
  all-orientations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact 18-seed finite closure and conditional graph lemma
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_oriented_swap_closure.py
          python oracles/python/class_a_oriented_swap_closure.py > /tmp/psc-oriented-swap-closure.json
