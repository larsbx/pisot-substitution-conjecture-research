name: PSC class-A minus H5 child exits

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_boundary_h5_children.mojo'
      - 'kernel/class_a_boundary_h5_children.mojo'
      - 'kernel/tests/test_class_a_boundary_h5_children.mojo'
      - 'oracles/python/class_a_boundary_h5_children.py'
      - 'tests/test_class_a_boundary_h5_children.py'
      - 'docs/class-a-boundary-h5-children-*.md'
      - 'evidence/class-a-boundary-h5-children-2026-10-27/**'
      - '.github/workflows/class-a-boundary-h5-children.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  both-oriented-stars:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact t-chamber, endpoint and occurrence replay
        run: |
          python -m pip install 'pytest>=7'
          python -m pytest -q tests/test_class_a_boundary_h5_children.py
          python oracles/python/class_a_boundary_h5_children.py > /tmp/boundary-h5-children.json
          cmp /tmp/boundary-h5-children.json evidence/class-a-boundary-h5-children-2026-10-27/probe.json
          python tools/make_proof_bank.py --check
      - name: Install Pixi
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Canonical complete stars and selected typed exits
        working-directory: kernel
        run: |
          pixi run --locked mojo run -I . tests/test_class_a_boundary_h5_exit.mojo
          pixi run --locked mojo run -I . tests/test_class_a_boundary_h5_children.mojo
          pixi run --locked mojo run -I . class_a_boundary_h5_children.mojo
