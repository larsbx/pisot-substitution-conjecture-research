name: C4 finite overlap carrier and new incidence

on:
  pull_request:
    paths:
      - '.github/workflows/c4-pair-overlap-new-incidence.yml'
      - 'docs/c4-finite-overlap-carrier*.md'
      - 'docs/c4-nonunit-madic-counting-bridge-2026-11-04.md'
      - 'kernel/psc/c4_pair_overlap_carrier.mojo'
      - 'kernel/psc/c4_pair_overlap_new_incidence.mojo'
      - 'kernel/c4_pair_overlap_new_incidence.mojo'
      - 'kernel/tests/test_c4_pair_overlap_new_incidence.mojo'
      - 'oracles/python/c4_pair_overlap_new_incidence.py'
      - 'tests/test_c4_pair_overlap_new_incidence_oracle.py'
      - 'evidence/c4-pair-overlap-new-incidence-2026-11-05/**'
      - 'kernel/psc/c4_nonunit_residue_occupancy.mojo'
      - 'kernel/psc/c4_finite_cylinder_overlap.mojo'
      - 'kernel/psc/c4_cylinder_density.mojo'
      - 'kernel/psc/derived_system.mojo'
      - 'kernel/psc/pisot.mojo'
      - 'kernel/psc/exact.mojo'
      - 'kernel/psc/words.mojo'
      - 'kernel/psc/bpa.mojo'
      - 'kernel/finite_exact/**'
      - 'kernel/finite_linear_algebra/**'
      - 'kernel/substitution_dynamics/**'
      - 'kernel/finite_graph/**'
      - 'kernel/mojo_smoke/**'
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'vendored.toml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-carrier-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the focused oracle test runner
        run: python -m pip install 'pytest>=7,<10'
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.81.0
          manifest-path: kernel/pixi.toml
          locked: true
      - name: Canonical carrier and complete graph regression
        working-directory: kernel
        run: pixi run --locked mojo run -I . tests/test_c4_pair_overlap_new_incidence.mojo
      - name: Emit the full twelve-source native packet
        working-directory: kernel
        run: pixi run --locked mojo run -I . c4_pair_overlap_new_incidence.mojo > /tmp/new-incidence-native.txt
      - name: Independent reconstruction and adversarial oracle tests
        env:
          PSC_NEW_INCIDENCE_NATIVE_OUTPUT: /tmp/new-incidence-native.txt
        run: python -m pytest --assert=plain -o addopts='' -q tests/test_c4_pair_overlap_new_incidence_oracle.py
      - name: Authenticate the native packet and committed exact receipt
        run: |
          python oracles/python/c4_pair_overlap_new_incidence.py --native /tmp/new-incidence-native.txt > /tmp/new-incidence-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path

          actual = json.loads(Path('/tmp/new-incidence-receipt.json').read_text())
          expected = json.loads(Path('evidence/c4-pair-overlap-new-incidence-2026-11-05/receipt.json').read_text())
          if actual != expected:
              raise SystemExit('Native-authenticated receipt differs from the committed exact receipt')
          print('Complete native packet matches the independent oracle and committed exact receipt.')
          PY
      - name: Generated evidence and governance surfaces
        run: |
          python tools/make_proof_bank.py --check
          PYTHONPATH=tools python -m claim_governance.cli --root .
          python tools/check_markdown_source.py
      - name: Retain the native packet and independent receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-incidence-certificate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/new-incidence-native.txt
            /tmp/new-incidence-receipt.json
          if-no-files-found: ignore
