name: Class-A residue rays closure and descent

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_line.mojo'
      - 'kernel/psc/class_a_line_graph.mojo'
      - 'kernel/psc/class_a_ray_tables.mojo'
      - 'kernel/psc/class_a_ray_d*.mojo'
      - 'kernel/psc/class_a_typed_carrier.mojo'
      - 'kernel/psc/class_a_carrier_closure.mojo'
      - 'kernel/psc/class_a_carrier_descent.mojo'
      - 'kernel/class_a_residue_ray.mojo'
      - 'kernel/tests/test_class_a_residue_rays.mojo'
      - 'oracles/python/class_a_carrier_closure.py'
      - 'oracles/python/class_a_descent_table.py'
      - 'tests/test_class_a_residue_rays.py'
      - 'evidence/class-a-residue-rays-2026-10-22/**'
      - 'docs/class-a-residue-rays-2026-10-22.md'
      - '.github/workflows/class-a-residue-rays.yml'
  workflow_dispatch:

jobs:
  exact-residue-rays:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent oracle
        run: python -m pip install 'pytest>=7'
      - name: Independent symbolic closure and descent verification of every tabulated ray
        run: |
          set -euo pipefail
          mkdir -p kernel/build/class-a-residue-rays
          python -m pytest -q tests/test_class_a_residue_rays.py 2>&1 | tee kernel/build/class-a-residue-rays/python-tests.log
      - name: Install Pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Locked native certificates, finite members, refusals and differential replay
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          pixi run --locked mojo run -I . tests/test_class_a_residue_rays.mojo 2>&1 | tee build/class-a-residue-rays/native-tests.log
          pixi run --locked mojo run -I . tests/test_class_a_carrier_closure.mojo 2>&1 | tee build/class-a-residue-rays/gap-one-plus-tests.log
          pixi run --locked mojo run -I . tests/test_class_a_minus_line.mojo 2>&1 | tee build/class-a-residue-rays/gap-one-minus-tests.log
      - name: Preserve fresh receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-a-residue-rays-receipts
          path: kernel/build/class-a-residue-rays/
          if-no-files-found: warn
