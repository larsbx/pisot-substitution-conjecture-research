name: Class-A residue rays closure and descent

on:
  pull_request:
    paths:
      - 'kernel/psc/class_a_line.mojo'
      - 'kernel/psc/class_a_line_graph.mojo'
      - 'kernel/psc/class_a_ray_tables.mojo'
      - 'kernel/psc/class_a_ray_d*.mojo'
      - 'kernel/psc/class_a_typed_carrier.mojo'
      - 'kernel/psc/class_a_carrier_closure.mojo'
      - 'kernel/psc/class_a_carrier_descent.mojo'
      - 'kernel/class_a_residue_ray.mojo'
      - 'kernel/tests/test_class_a_residue_rays.mojo'
      - 'kernel/psc/class_a_d2_plus_line.mojo'
      - 'kernel/psc/class_a_d2_parity_carrier.mojo'
      - 'kernel/class_a_d2_plus_line.mojo'
      - 'kernel/tests/test_class_a_d2_plus_line.mojo'
      - 'oracles/python/class_a_carrier_closure.py'
      - 'oracles/python/class_a_descent_table.py'
      - 'tests/test_class_a_residue_rays.py'
      - 'tests/test_class_a_d2_plus_ray_carrier.py'
      - 'oracles/python/class_a_d2_parity_carrier.py'
      - 'evidence/class-a-residue-rays-2026-10-22/**'
      - 'docs/class-a-residue-rays-2026-10-22.md'
      - 'evidence/class-a-d2-plus-rays-2026-10-22/**'
      - 'docs/class-a-d2-plus-rays-2026-10-22.md'
      - '.github/workflows/class-a-residue-rays.yml'
  workflow_dispatch:

concurrency:
  # A newer commit on the same branch or pull request supersedes this run's
  # queued and in-progress checks. Runs on main get a group of their own, so
  # every main commit keeps its receipts.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  exact-residue-rays:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent oracle
        run: python -m pip install 'pytest>=7'
      - name: Independent symbolic closure and descent verification of every tabulated ray
        run: |
          set -euo pipefail
          mkdir -p kernel/build/class-a-residue-rays
          python -m pytest -q tests/test_class_a_residue_rays.py tests/test_class_a_d2_plus_ray_carrier.py 2>&1 | tee kernel/build/class-a-residue-rays/python-tests.log
      - name: Install Pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Locked native certificates, finite members, refusals and differential replay
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          pixi run --locked mojo run -I . tests/test_class_a_residue_rays.mojo 2>&1 | tee build/class-a-residue-rays/native-tests.log
          pixi run --locked mojo run -I . tests/test_class_a_carrier_closure.mojo 2>&1 | tee build/class-a-residue-rays/gap-one-plus-tests.log
          pixi run --locked mojo run -I . tests/test_class_a_minus_line.mojo 2>&1 | tee build/class-a-residue-rays/gap-one-minus-tests.log
          pixi run --locked mojo run -I . tests/test_class_a_d2_plus_line.mojo 2>&1 | tee build/class-a-residue-rays/d2-plus-line-tests.log
      - name: d=2 plus line theorem and shown witnesses, compared with the archived packet
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          E=../evidence/class-a-d2-plus-rays-2026-10-22
          mkdir -p build/class-a-residue-rays/witness
          pixi run --locked mojo build -I . class_a_d2_plus_line.mojo -o build/d2p
          build/d2p theorem 2>&1 | tee build/class-a-residue-rays/theorem.log
          diff "$E/theorem.log" build/class-a-residue-rays/theorem.log
          for n in $(seq 13 24); do
            build/d2p witness "$n" > "build/class-a-residue-rays/witness/witness-n$n.log" 2>&1
            diff "$E/witness/witness-n$n.log" "build/class-a-residue-rays/witness/witness-n$n.log"
          done
      - name: Preserve fresh receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-a-residue-rays-receipts
          path: kernel/build/class-a-residue-rays/
          if-no-files-found: warn
