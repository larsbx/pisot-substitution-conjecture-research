name: Class-D positive-b wedge candidates

on:
  pull_request:
    paths:
      - 'kernel/pixi.toml'
      - 'kernel/pixi.lock'
      - 'kernel/psc/param_poly.mojo'
      - 'kernel/psc/symbolic_line.mojo'
      - 'kernel/symbolic_line_certificate.mojo'
      - '.github/workflows/class-d-positive-b-evidence.yml'
  workflow_dispatch:

jobs:
  residual-wedge:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # Residual class D after shifting b' = b - 1 >= 0.
          # s=+1: (p,q,r)=(4,3,1)+a(3,3,2)+b'(1,1,1)
          - { name: 'plus-positive-b', args: 'wedge D 4 3 1 3 3 1 1 2 1' }
          # s=-1: (p,q,r)=(6,7,5)+a(3,3,2)+b'(1,1,1)
          - { name: 'minus-positive-b', args: 'wedge D 6 3 1 7 3 1 5 2 1' }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Run exact two-parameter closure
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . symbolic_line_certificate.mojo ${{ matrix.args }} 2>&1 | tee positive-b.log
          grep -F 'symbolic graph for every a >=' positive-b.log
          grep -F 'cross-check at (a0, b0) and (a0 + 5, b0 + 3): symbolic graph = exact graph' positive-b.log

  complete-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi
        run: |
          set -o pipefail
          curl --retry 5 --retry-all-errors --retry-delay 3 -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Certify both complete positive-b quadrants
        working-directory: kernel
        run: |
          set -o pipefail
          pixi run mojo run -I . class_d_positive_b_certificate.mojo 2>&1 | tee complete-positive-b.log
          grep -F 'COMPLETE_POSITIVE_B_WEDGE s=+1' complete-positive-b.log
          grep -F 'COMPLETE_POSITIVE_B_WEDGE s=-1' complete-positive-b.log
