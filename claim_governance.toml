# Claim-governance policy for larsbx/pisot-substitution-conjecture-research.
#
# Read by the vendored `tools/claim_governance` package (larsbx/finite-math-kernels
# audit/, pinned in vendored.toml).  This file is the repository's whole policy: the
# status vocabulary its surfaces use, the claim ledger that every status
# surface must agree with, the phrases that may not promote an open claim,
# and the numerical primitives banned from the exact kernel.  It states no
# mathematics.  The classification of each claim below mirrors
# docs/claim-status-and-source-map-2026-09-13.md; when a status changes,
# change it here and on every surface in the same commit, which is what
# docs/README.md asks reviewers to do by hand.
#
# Run: PYTHONPATH=tools python -m claim_governance.cli --root .

[repository]
name = "larsbx/pisot-substitution-conjecture-research"

[scan]
prose = ["README.md", "docs/**/*.md", "manuscripts/*.tex", "manuscripts/*.md"]
source = ["mojo/psc/**/*.mojo", "mojo/*.mojo", "mojo/tests/*.mojo", "src/psc_research/*.py"]
exclude = ["archive/**", "docs/source-imports/**"]

# ---------------------------------------------------------------------------
# Status vocabulary: docs/claim-status-and-source-map-2026-09-13.md section
# "Status vocabulary", the [TAG] chains of the ledgers and README, and the
# \Status{...} macro of the manuscript.
# ---------------------------------------------------------------------------
[status]
classes = ["proved", "imported", "historical", "finite-domain", "conditional", "open", "bridge", "evidence", "retired", "missing-source"]

[status.synonyms]
"Repository-proved" = "proved"
"repository-proved" = "proved"
"[PROVED]" = "proved"
"[PROVED equivalence]" = "proved"
"\\Status{Theorem}" = "proved"
"Imported theorem" = "imported"
"imported theorem" = "imported"
"[IMPORTED theorem]" = "imported"
"[IMPORTED: Barge–Štimac–Williams]" = "imported"
"\\Status{Imported}" = "imported"
"\\begin{importedtheorem}" = "imported"
"Historical restricted theorem" = "historical"
"Finite-domain theorem" = "finite-domain"
"finite-domain theorem" = "finite-domain"
"Exact finite negative calibration" = "finite-domain"
"\\Status{Finite computation}" = "finite-domain"
"\\begin{computation}" = "finite-domain"
"Conditional theorem" = "conditional"
"\\Status{Conditional}" = "conditional"
"\\begin{hypothesis}" = "conditional"
"Open conjectural gate" = "open"
"Open theorem target" = "open"
"[OPEN]" = "open"
"OPEN" = "open"
"**Open**" = "open"
"\\Status{Open}" = "open"
"\\begin{problem}" = "open"
"\\begin{conjecture}" = "open"
"Open bridge" = "bridge"
"OPEN bridge" = "bridge"
"\\Status{Conjectural bridge}" = "bridge"
"Empirical evidence" = "evidence"
"\\Status{Empirical}" = "evidence"
"Retired claim" = "retired"
"Historical source missing" = "missing-source"

# ---------------------------------------------------------------------------
# Terminology.  PSC keeps no terminology registry; only the bridge-phrase
# discipline applies, so that no analogy is written as an identification.
# ---------------------------------------------------------------------------
[terminology]
# "corresponds exactly" is not listed: in this repository it states exact
# algebraic equalities inside proofs, not analogies.
risky_phrases = ["obvious isomorphism", "canonical analogy", "essentially the same", "nothing but", "proof by analogy"]
negating_context = ["not ", "no ", "without ", "unless ", "must not", "cannot", "does not", "is not", "never"]

# ---------------------------------------------------------------------------
# Statements need a status label.  A proof note declares its status once in
# a **Status:** line near its top; the claim map and ledgers label headings
# with **Status: ...** or table cells; the state-of-program manuscript labels
# environments with \Status{...} or uses a self-labelling environment.
#
# Known debt, allowlisted so that the check stays on for everything else:
#   manuscripts/PSC_balanced_pair_state_2026-09-13.tex   four lemmas of the
#       G1b-1 reconstruction (Summable decay, Prefix decomposition, Bounded
#       contracting component, Zero symbolic length) carry no \Status{...}
#   manuscripts/PSC_PROOF_next_source_audit.tex          source-audit note
#       written before the \Status{...} convention; no environment is labelled
# ---------------------------------------------------------------------------
[claims]
paths = ["docs/*.md", "manuscripts/*.tex"]
statement_kinds = ["Theorem", "Proposition", "Lemma", "Corollary", "Conjecture", "Hypothesis", "Open Problem", "Imported Theorem", "Computational Proposition"]
window_lines = 6
file_status_marker = "**Status:**"
file_status_lines = 10
allow = ["manuscripts/PSC_balanced_pair_state_2026-09-13.tex", "manuscripts/PSC_PROOF_next_source_audit.tex"]

# ---------------------------------------------------------------------------
# Promotion: an unsettled claim must not be described as proved.
# ---------------------------------------------------------------------------
[promotion]
proving_phrases = ["is proved", "are proved", "is now proved", "has been proved", "have been proved", "we prove", "we have proved", "is a theorem", "is now a theorem", "is established", "completes the proof", "settles", "is closed"]
negating_context = ["not ", "no ", "remains open", "remain open", "open premise", "open gate", "open problem", "OPEN", "would", "conditional", "without", "if ", "once ", "unless", "cannot", "suffic", "assum", "requir", "needs", "target", "obligation", "must", "does not", "do not", "unproved", "premise", "stronger", "evidence", "issue #", "\\Status{Open}"]
settled_classes = ["proved", "imported", "historical", "finite-domain", "conditional"]
radius = 120
# The state-of-program manuscript names G1 and SCC Producer in its abstract
# next to "We prove the reduction" and only says that both remain open in
# its last sentence, beyond any useful radius; its status discipline is the
# \Status{...} macro, which the claims check and the ledger surfaces enforce.
allow = ["manuscripts/PSC_balanced_pair_state_2026-09-13.tex"]

# ---------------------------------------------------------------------------
# Numerics: the exact kernel and its oracle compute over unbounded integers
# and rationals only (docs/exact-arithmetic-binding.md, criterion C1).
# ---------------------------------------------------------------------------
[[numerics.rule]]
name = "no-float-in-kernel"
pattern = '\b(?:Float16|Float32|Float64|BFloat16|FloatLiteral|Float|float)\b|(?<![\w.])(?:\d(?:_?\d)*\.(?:\d(?:_?\d)*)?|\.\d(?:_?\d)*)(?:[eE][+-]?\d(?:_?\d)*)?(?![\w.])|(?<![\w.])\d(?:_?\d)*[eE][+-]?\d(?:_?\d)*(?![\w.])'
paths = ["mojo/psc/**/*.mojo", "mojo/*.mojo", "mojo/tests/*.mojo"]
message = "floating point in exact kernel scope (binding criterion C1)"

[[numerics.rule]]
name = "no-float-in-oracle"
pattern = '\bfloat\b|\bmath\.(?:sqrt|log|exp|sin|cos|pow)\b|\bnumpy\b'
paths = ["src/psc_research/*.py"]
message = "the Python oracle must stay exact (fractions.Fraction and int only)"

# ---------------------------------------------------------------------------
# Claim ledger.  Two parts.  The hand-written entries below cover load-bearing
# claims that are not nodes of the TLA+ proof-dependency ledger (finite-domain
# certificates, historical and bridge claims, PSC itself).  Every node of the
# TLA+ ledger has a generated entry between the markers at the end of this
# file, written by scripts/make_ledger.py from the proof-record table it
# holds (serialized to tla/ledger.json, itself generated) through the vendored
# tools/proof_records/generate_ledgers.py; do not edit that block or
# ledger.json, edit the table in scripts/make_ledger.py and regenerate.  Surfaces:
#   map    = docs/claim-status-and-source-map-2026-09-13.md (the live claim map)
#   ledger = docs/conjecture-ledger.md (prose dependency ledger)
#   weekly = docs/completion-ledger-2026-09-14.md (weekly snapshot and priority table)
#   README = README.md (headline chain)
#   index  = docs/ledger-index.md (generated; one row per TLA+ node)
#   tla    = tla/Ledger.tla (ProvedDef / ImportedDef / WithdrawnDef membership;
#            a node whose implication is proved but whose premises are open,
#            such as G1 or SCCProducer, is in ProvedDef and carries a
#            status override recorded in the ledger's status_note evidence)
# ---------------------------------------------------------------------------

