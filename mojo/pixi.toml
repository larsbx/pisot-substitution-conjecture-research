[workspace]
name = "psc-mojo"
version = "0.1.0"
description = "Exact computational kernel for the alphabet-3 Spectral module of the PSC balanced-pair program"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
modular = ">=26.6.0.dev2026090805,<27"

[tasks]
verify = "mojo run verify.mojo"
test = "mojo run -I . tests/test_kernel.mojo"
