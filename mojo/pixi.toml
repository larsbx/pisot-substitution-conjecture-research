[workspace]
name = "psc-mojo"
version = "0.1.0"
description = "Canonical exact Mojo implementation for the PSC balanced-pair research program"
channels = ["https://conda.modular.com/max-nightly/", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
modular = ">=26.6.0.dev2026090805,<27"

[tasks]
verify = "mojo run -I . verify.mojo"
kernel = "mojo run -I . tests/test_kernel.mojo"
words = "mojo run -I . tests/test_words_streaming.mojo"
legal-tower = "mojo run -I . tests/test_legal_tower.mojo"
hierarchy-offset = "mojo run -I . tests/test_hierarchy_offset.mojo"
signing = "mojo run -I . tests/test_signing.mojo"
bd-endpoint = "mojo run -I . tests/test_bd_endpoint.mojo"
hub-cocycle = "mojo run -I . tests/test_hub_cocycle.mojo"
hub-selector = "mojo run -I . tests/test_hub_selector.mojo"
good-edge-system = "mojo run -I . tests/test_good_edge_system.mojo"
renewal = "mojo run -I . tests/test_renewal.mojo"
renewal-address = "mojo run -I . tests/test_renewal_address.mojo"
joint-local-type = "mojo run -I . tests/test_joint_local_type.mojo"
joint-local-census = "mojo run -I . tests/test_joint_local_census.mojo"
loop-quotient-census = "mojo run -I . tests/test_loop_quotient_census.mojo"
finite-cokernel-address = "mojo run -I . tests/test_finite_cokernel_address.mojo"
affine-ancestry-trace = "mojo run -I . tests/test_affine_ancestry_trace.mojo"
overlap-seed-patch = "mojo run -I . tests/test_overlap_seed_patch.mojo"
test = "mojo run -I . tests/test_kernel.mojo && mojo run -I . tests/test_words_streaming.mojo && mojo run -I . tests/test_legal_tower.mojo && mojo run -I . tests/test_hierarchy_offset.mojo && mojo run -I . tests/test_signing.mojo && mojo run -I . tests/test_bd_endpoint.mojo && mojo run -I . tests/test_hub_cocycle.mojo && mojo run -I . tests/test_hub_selector.mojo && mojo run -I . tests/test_good_edge_system.mojo && mojo run -I . tests/test_renewal.mojo && mojo run -I . tests/test_renewal_address.mojo && mojo run -I . tests/test_joint_local_type.mojo && mojo run -I . tests/test_joint_local_census.mojo && mojo run -I . tests/test_loop_quotient_census.mojo && mojo run -I . tests/test_finite_cokernel_address.mojo && mojo run -I . tests/test_affine_ancestry_trace.mojo && mojo run -I . tests/test_overlap_seed_patch.mojo"
check = "mojo run -I . tests/test_kernel.mojo && mojo run -I . tests/test_words_streaming.mojo && mojo run -I . tests/test_legal_tower.mojo && mojo run -I . tests/test_hierarchy_offset.mojo && mojo run -I . tests/test_signing.mojo && mojo run -I . tests/test_bd_endpoint.mojo && mojo run -I . tests/test_hub_cocycle.mojo && mojo run -I . tests/test_hub_selector.mojo && mojo run -I . tests/test_good_edge_system.mojo && mojo run -I . tests/test_renewal.mojo && mojo run -I . tests/test_renewal_address.mojo && mojo run -I . tests/test_joint_local_type.mojo && mojo run -I . tests/test_joint_local_census.mojo && mojo run -I . tests/test_loop_quotient_census.mojo && mojo run -I . tests/test_finite_cokernel_address.mojo && mojo run -I . tests/test_affine_ancestry_trace.mojo && mojo run -I . tests/test_overlap_seed_patch.mojo && mojo run -I . verify.mojo"
